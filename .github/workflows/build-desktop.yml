name: Build Desktop (macOS)

# 可复用 workflow：被 release.yml 调用，也可手动触发
# 注意：不监听 tag push —— 发布统一走 release.yml，避免同一 tag 触发两条流水线重复构建
on:
  workflow_call:
    inputs:
      ref:
        description: '构建目标 ref（分支/tag/SHA），默认为触发 ref'
        required: false
        type: string
      require-signing:
        description: '强制签名+公证（公开发布通道必开 true；secrets 不齐直接失败，拒绝产出未签名发布物）'
        required: false
        type: boolean
        default: false
  workflow_dispatch:
    inputs:
      ref:
        description: '构建目标 ref（分支/tag/SHA）'
        required: false
        type: string
      require-signing:
        description: '强制签名+公证（公开发布通道必开 true；secrets 不齐直接失败）'
        required: false
        type: boolean
        default: false

# 同一 ref 的并发构建互斥
concurrency:
  group: build-desktop-${{ github.ref }}
  cancel-in-progress: false

jobs:
  build:
    name: Build macOS artifacts (x64 + arm64)
    # 单 runner 一次构建双架构：electron-builder 会在同一 run 内生成
    # 一份同时覆盖 x64/arm64 的 latest-mac.yml，避免双 job 各自产出同名清单互相覆盖
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          ref: ${{ inputs.ref || github.ref }}

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # 版本由根 package.json 的 packageManager 字段决定，勿重复声明避免冲突

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependency packages
        run: pnpm turbo run build --filter=@zh/desktop^...

      # desktop 的 injected 依赖副本在 install 时快照（早于构建，副本内无 dist），
      # 删除后重装让副本带上依赖构建产物，desktop 自身 tsc 才能解析 @zh/* 声明
      - name: Refresh desktop injected dependency copies
        run: rm -rf packages/desktop/node_modules && pnpm install --frozen-lockfile

      - name: Build desktop app (tsc && vite build)
        run: pnpm turbo run build --filter=@zh/desktop

      - name: Build desktop macOS artifacts
        working-directory: packages/desktop
        env:
          # 签名证书（base64 编码的 .p12）。未配置时产出未签名产物（仅限内部测试）。
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # 公证凭据：electron-builder 26 内置公证（无需 afterSign 脚本），三者需齐全
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
        run: |
          # 构件产物输出至仓库外 ../../../build-output（见 package.json build.directories.output），
          # 避免 465M+ 的 .app/.zip 每次构建污染仓库工作树
          REQUIRE_SIGNING="${{ inputs.require-signing }}"
          if [ "$REQUIRE_SIGNING" = "true" ]; then
            # 公开发布通道（release.yml 调用）：签名+公证是硬性要求，缺失即失败，绝不产出未签名发布物
            if [ -z "$CSC_LINK" ] || [ -z "$CSC_KEY_PASSWORD" ] || [ -z "$APPLE_ID" ] || [ -z "$APPLE_APP_SPECIFIC_PASSWORD" ] || [ -z "$APPLE_TEAM_ID" ]; then
              echo "::error::require-signing=true 但签名/公证 secrets 不齐全（需 CSC_LINK / CSC_KEY_PASSWORD / APPLE_ID / APPLE_APP_SPECIFIC_PASSWORD / APPLE_TEAM_ID 全部配置）"
              echo "::error::请先在仓库 Settings → Secrets and variables → Actions 配置（Developer ID 证书 base64 + 公证账号），否则公开发布的更新链路无签名校验，属高危险状态，已中止。"
              exit 1
            fi
            echo "签名与公证凭据齐全，强制签名 + 公证（forceCodeSigning + notarize）"
            pnpm exec electron-builder --mac --x64 --arm64 -c.mac.notarize=true -c.forceCodeSigning=true --publish never
          else
            # 手动/内部触发：凭据齐全则按最优路径签名公证，缺失则产出未签名产物供内部测试
            NOTARIZE_ARGS=""
            if [ -n "$CSC_LINK" ] && [ -n "$APPLE_ID" ] && [ -n "$APPLE_APP_SPECIFIC_PASSWORD" ] && [ -n "$APPLE_TEAM_ID" ]; then
              echo "签名与公证凭据齐全，启用公证（-c.mac.notarize=true）"
              NOTARIZE_ARGS="-c.mac.notarize=true"
            else
              echo "凭据不全，产出未签名产物（严禁上传到公开 release 通道）"
            fi
            # 双架构一次构建：生成单一 latest-mac.yml（含 x64/arm64 两条更新记录）
            # --publish never：发布统一由 release.yml 的 Publish job 上传产物，
            # electron-builder 在 CI + tag 环境默认会尝试自动发布并要求 GH_TOKEN（未注入即失败）
            pnpm exec electron-builder --mac --x64 --arm64 $NOTARIZE_ARGS --publish never
          fi

      - name: Verify code signature & notarization (release builds)
        if: ${{ inputs.require-signing == true }}
        working-directory: packages/desktop
        run: |
          # 发版产物双重校验：codesign 签名有效性 + spctl 公证状态。
          # 任一失败即中止 —— 未签名/未公证的更新包一旦进公开通道，攻击者可替换安装包实现 RCE。
          # 遍历 x64(mac/) 与 arm64(mac-arm64/) 两组产物逐一校验
          APPS=$(ls -d ../../../build-output/mac*/*.app 2>/dev/null)
          if [ -z "$APPS" ]; then
            echo "::error::未找到构建产物 ../../../build-output/mac*/*.app，签名校验中止"
            exit 1
          fi
          for APP_DIR in $APPS; do
            codesign --verify --deep --strict "$APP_DIR"
            spctl -a -t exec -vv "$APP_DIR" 2>&1 | grep -q "accepted" \
              || { echo "::error::spctl 未通过（未签名或未公证）: $APP_DIR"; exit 1; }
            echo "签名与公证校验通过：$APP_DIR"
          done
          echo "全部产物签名与公证校验通过 ✓"

      - name: Collect artifacts
        working-directory: packages/desktop
        run: |
          mkdir -p artifacts
          # dmg 用于首次安装分发；zip 供 electron-updater 自动更新下载（mac 更新走 zip）
          cp ../../../build-output/*.dmg artifacts/ 2>/dev/null || true
          cp ../../../build-output/*.zip artifacts/ 2>/dev/null || true
          cp ../../../build-output/latest-mac.yml artifacts/ 2>/dev/null || true
          ls -la artifacts/

      - name: Upload artifacts
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: zhiyan-codeshield-macos-${{ github.run_id }}
          path: packages/desktop/artifacts/*
          if-no-files-found: error
          retention-days: 30
