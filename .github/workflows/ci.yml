name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11 要求 Node ≥22.13（node:sqlite 内置模块），Node 20 已 EOL 不可用
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本由根 package.json 的 packageManager 字段决定，勿重复声明避免冲突

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (exclude desktop)
        run: pnpm turbo run build --filter='!@zh/desktop'

      # desktop 的 injected 依赖副本在 install 时快照（早于构建，副本内无 dist），
      # 删除后重装让副本带上构建产物，desktop 类型检查才能解析 @zh/* 声明
      - name: Refresh desktop injected dependency copies
        run: rm -rf packages/desktop/node_modules && pnpm install --frozen-lockfile

      - name: Verify dist/sop sync with kernel source
        run: pnpm --filter zhshield-cli verify:sop

      - name: Full typecheck (15 packages)
        run: pnpm typecheck

      - name: Run all tests
        run: pnpm test

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Dependency audit (continue on error)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      - name: Run tests with coverage
        if: matrix.node-version == 22
        continue-on-error: true
        run: pnpm turbo run test -- --coverage --reporter=json --outputFile=coverage-summary.json

      - name: Upload coverage summary (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-node${{ matrix.node-version }}
          path: packages/*/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        # 版本由根 package.json 的 packageManager 字段决定，勿重复声明避免冲突

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
