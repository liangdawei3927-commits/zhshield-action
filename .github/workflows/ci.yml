name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  # 发布漂移门禁 —— 防止「代码改了一堆，版本号纹丝不动」
  #
  # 2026-10-29 实锤背景：0.2.0 之后累计 103 个提交（feat/fix 70 个）从未触发版本递进，
  # 版本号一直停在 0.2.0。而客户端 electron-updater 的更新判定是
  # 「latest-mac.yml 的 version > 本地 app.getVersion()」，版本不变 ⇒ 恒判定「已是最新」，
  # 那批修复一个都送不到用户机器上，且用户会被明确告知「当前已是最新版」。
  #
  # ⚠️ 必须 fetch-depth: 0 —— 脚本以「最近一个合法语义 tag」为锚点计算 diff，
  #    浅克隆取不到锚点会直接失败（而非当作无改动放行），这是刻意的：静默放行等于没有门禁。
  # 脚本为纯 node + git，无第三方依赖，故无需 pnpm install，秒级反馈。
  #
  # 注意：锚点是 tag。v0.3.0 打上之前本门禁处于「版本已递进」的放行态，
  #       打上 tag 之后才真正进入监控态 —— 所以发版务必补 tag，别让门禁空转。
  version-drift:
    name: Release Drift Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout (full history for tag anchoring)
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4
        with:
          fetch-depth: 0

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        # ⚠️ 上面这串 SHA 必须是 40 位。2026-11-05 这里少打了 3 个字符（37 位），
        #    runner 报 "unable to find version"，只有用到这一行的 Release Drift Gate 挂，
        #    同工作流其他 job 用对的 SHA 全绿 —— 这种错最容易被误判成"CI 抽风"。
        with:
          node-version: 22

      - name: Check release drift
        run: node scripts/check-release-drift.mjs --strict

  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11 要求 Node ≥22.13（node:sqlite 内置模块），Node 20 已 EOL 不可用
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # 版本由根 package.json 的 packageManager 字段决定，勿重复声明避免冲突

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # ⚠️ 必须在 Build 之前：build-cli.mjs 会先 rm -rf dist/sop 再 cp -r 从 kernel/src/sop
      # 重建，若本校验排在其后，比较对象就变成"刚刚重新生成的产物"，结构上永不红。
      # 2026-10-25 实测：提交里的 dist/sop 已漂移（cache/sop-sync-scheduler.ts 陈旧），
      # 而 CI 因这个顺序一直绿 —— 门禁看着最严谨时恰恰什么都没测。
      # 本步只读仓库文件，无需构建产物。
      - name: Verify dist/sop sync with kernel source (before build)
        run: pnpm --filter zhshield-cli verify:sop

      - name: Build (exclude desktop)
        run: pnpm turbo run build --filter='!@zh/desktop'

      # 产物新鲜度门禁（报告 §5.3）—— dist/zhshield.js 提交进 git，Action/npx 直装它。
      # 只在「构建后的产物指纹 ≠ HEAD 里提交的产物指纹」时红，即"改了 src 没重新 build 提交"。
      # 必须排在 Build 之后：判据是"提交的产物 == 用同一份源码构建出来的产物"。
      - name: Committed CLI bundle matches sources (dist freshness)
        run: pnpm --filter zhshield-cli verify:dist-fresh -- --no-build

      # A15 断网端到端门禁 —— 「漏洞库不可达」必须显形，不能折算成 0 漏洞
      #
      # 为什么能进 CI：三个场景全部指向 127.0.0.1（本地桩 / 已关闭端口 / 挂起桩），
      # 通过 ZH_OSV_BASE_URL 覆盖 OSV 基地址 —— 不依赖外网，也不依赖是否装了什么工具，
      # 因此结果与 CI 网络环境无关、不会抖。
      #
      # 为什么必须有：这条判据的价值在「不可达那一侧」——只验在线成功，等于只证明了
      # 「查得到时能查」，而用户真正受到伤害的是「查不到却显示 0 漏洞」。
      # 依赖 build 步骤产出的 packages/cli/dist/zhshield.js。
      - name: A15 offline deps gate (unreachable ≠ clean)
        if: matrix.node-version == 22
        run: pnpm verify:offline

      # 重构坏味道基线门禁：仅拦截「相对 .refactor-baseline.json 的新增」，
      # 存量放行（ratchet）。zhcheck 从 packages/refactor/dist 导入引擎，
      # 故必须在上一步构建之后运行。
      - name: Refactor baseline gate
        run: pnpm check:refactor:ci

      # desktop 的 injected 依赖副本在 install 时快照（早于构建，副本内无 dist），
      # 删除后重装让副本带上构建产物，desktop 类型检查才能解析 @zh/* 声明
      - name: Refresh desktop injected dependency copies
        run: rm -rf packages/desktop/node_modules && pnpm install --frozen-lockfile

      # pnpm 对 file: 目录依赖生成实体副本：已存在文件随源码更新，新增文件永不自动同步
      # （install / --force 均无效）。新增 .ts 源文件后副本会静默缺文件，
      # 下游报 "Cannot find module './xxx'" 且单跑也不过，极易误判为代码缺陷。
      - name: Check injected dependency copies are in sync
        run: pnpm check:copies

      - name: Full typecheck (15 packages)
        run: pnpm typecheck

      # 检测能力闭环门禁 —— 「声明了什么」vs「实际会执行什么」
      #
      # 为什么要有这道门禁（2026-11-02 实测驱动）：
      #   桌面安全中心此前对 7 条 active semgrep 规则（SQL 注入 / XSS / 命令注入 / CSRF
      #   / 路径穿越）一次都不会求值 —— security 域走 domain-executor，不经过 SOP 引擎。
      #   同一份夹具上 CLI `inspect --sop` 检出 1 条、桌面端 0 检出且 status=ok、
      #   degraded=undefined：用户看到「一切正常」，真相是「什么都没查」。
      #
      # 这类断裂在报告里没有任何异常提示，只能靠「声明 vs 实际」比对发现。
      # 本门禁把该事实变成可执行的断言：存在 active 但永远不会执行的规则 → 失败。
      #
      # 判据只看 active 规则；draft / trial 是规则的正常生命周期状态，不拦。
      # 「尚未实现的能力」（planned / deprecated）也不拦 —— 那是「还没做」的诚实记录，
      # 由 zhshield capability 打印出来供人决策；UI 侧的能力注册表保证它们不被宣称。
      - name: Capability closure gate (declaration vs actual)
        run: pnpm --filter zhshield-cli exec tsx src/index.ts capability

      # R7 规则可达性门禁 —— 不跑扫描就判定「这条 tool-dispatch 规则有没有可能被评估」
      #
      # 与上面的闭环门禁互补：闭环门禁问「域路径通不通」，本门禁问「规则声明的工具
      # 在能力表里存不存在」。判据只认 TOOL_CAPABILITIES 这一条硬事实，不猜运行时适配器
      # （猜会造出「看起来查了、其实没效力」的假门禁）。空规则集判 INVALID，不判 PASS。
      - name: Rule reachability gate (static)
        run: pnpm --filter @zh/kernel verify:rule-reachability

      # 类型严格迁移棘轮门禁（报告 §5.2）—— 债可以变少，不能变多
      #
      # 判据：① 已迁移包不得再显式关闭严格标志；② 待迁移包数量不得超过基线；
      #        ③ 已迁移/已合规包必须真的通过严格类型检查（清单是手写的，编译才是事实）。
      # 没有这道门禁，债务会反弹：任何人加一行 "noUncheckedIndexedAccess": false
      # 就能把整个包的严格性退回去，且没有任何东西会红。
      - name: Strict type migration ratchet
        run: node scripts/check-strict-migration.mjs

      # sop-pipeline.test.ts 的 gitleaks 用例断言 security.scan.gitleaks.hardcoded-key
      # 必须真实检出（status 'failed'），ubuntu-latest 镜像未预装 gitleaks，
      # 需在跑测试前安装到 /usr/local/bin（PATH 内）。semgrep/trivy 不装：
      # security 域测试在工具缺失时已优雅降级跳过。
      # ⚠️ 但「优雅跳过」不可用于质量门禁 —— SOP 规则质量门禁（需 semgrep）单独成 job
      #    「Rule Quality Gate」，在那里装工具 + 置 ZH_GATE_REQUIRE_SEMGREP=1。
      - name: Install gitleaks
        if: matrix.node-version == 22
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Run all tests
        run: pnpm test

      # 端到端集成测试（pipeline 调用真实 eslint/gitleaks，~250s）
      # 默认 pnpm test 跳过（describe.skipIf !RUN_E2E）；此处显式启用，仅 node 22 跑一次
      - name: Run E2E tests (pipeline)
        if: matrix.node-version == 22
        run: RUN_E2E=1 pnpm --filter @zh/pipeline test

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Dependency audit (continue on error)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      - name: Run tests with coverage
        if: matrix.node-version == 22
        continue-on-error: true
        run: pnpm turbo run test -- --coverage --reporter=json --outputFile=coverage-summary.json

      - name: Upload coverage summary (even on failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary-node${{ matrix.node-version }}
          path: packages/*/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14

  # SOP 规则质量门禁 —— golden 断言回放（precision / recall 双阈值）
  # 机制：packages/kernel/src/sop/quality/rule-accuracy.ts
  # 用例：packages/inspect/src/__tests__/rule-quality-gate.test.ts
  #
  # 为什么单独成 job、不并进 build-and-test：
  #   ① 需要 semgrep（主 job 刻意不装，见其上注释），冷启动 + taint 扫描约 1–2 分钟
  #   ② 失败语义单一：红 = 规则质量退化，与编译/单测失败区分开
  #
  # ⚠️ 必须设 ZH_GATE_REQUIRE_SEMGREP=1 —— 否则 semgrep 缺失时门禁会「优雅跳过」→ 假绿。
  #    本项目历史上对 security 域正是「工具缺就跳过」，这个策略用在门禁上等于没有门禁。
  rule-quality-gate:
    name: Rule Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # semgrep 提供 taint 数据流分析（path-traversal 规则依赖）。
      # 用 setup-python 的托管解释器：Ubuntu 24.04 系统 pip 受 PEP 668（externally-managed）限制。
      - name: Setup Python
        uses: actions/setup-python@a26af69be951a213d495a4c3e4e4022e16d87065 # v5
        with:
          python-version: '3.12'

      # 版本与本地验证基线对齐（1.172.0）。taint 分析行为随版本可能变化，
      # 升级 semgrep 必须重跑本门禁确认 precision/recall 未漂移。
      - name: Install semgrep
        run: pip install semgrep==1.172.0

      # 门禁依赖构建产物：规则资产在 packages/kernel/dist/assets/semgrep/，
      # 注入路径回退链也指向 dist；不构建则规则解析落空。
      # 构建 inspect 的依赖闭包即可覆盖（比全量构建快，且不含 desktop）。
      - name: Build inspect dependency closure
        run: pnpm turbo run build --filter=@zh/inspect...

      # 先自证工具真在 PATH：装坏了要在这里红，而不是让门禁静默跳过
      - name: Verify semgrep is available
        run: semgrep --version

      - name: Rule quality gate (golden replay)
        env:
          ZH_GATE_REQUIRE_SEMGREP: '1'
        run: pnpm --filter @zh/inspect exec vitest run src/__tests__/rule-quality-gate.test.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # 版本由根 package.json 的 packageManager 字段决定，勿重复声明避免冲突

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # 桌面端 E2E 冒烟：Playwright 驱动真实 Electron，校验窗口/欢迎页/导航/侧边栏
  # Electron GUI 依赖 macOS，与 ubuntu 主流水线分开跑
  desktop-e2e:
    name: Desktop E2E (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependency packages
        run: pnpm turbo run build --filter=@zh/desktop^...

      # 与 build-desktop.yml 同款：注入副本在 install 时快照（早于构建，副本内无 dist），刷新后方可解析 @zh/* 声明
      - name: Refresh desktop injected dependency copies
        run: rm -rf packages/desktop/node_modules && pnpm install --frozen-lockfile

      - name: Build desktop app (tsc && vite build)
        run: pnpm turbo run build --filter=@zh/desktop

      - name: Run desktop E2E
        working-directory: packages/desktop
        run: pnpm exec playwright test

      - name: Upload E2E traces (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-traces-${{ github.run_id }}
          path: packages/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 14
