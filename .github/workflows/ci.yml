name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (exclude desktop)
        run: pnpm turbo run build --filter='!@zh/desktop'

      - name: Verify dist/sop sync with kernel source
        run: pnpm --filter zhshield-cli verify:sop

      - name: Full typecheck (15 packages)
        run: pnpm typecheck

      - name: Run all tests
        run: pnpm test

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Dependency audit (continue on error)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      - name: Run tests with coverage
        if: matrix.node-version == 22
        continue-on-error: true
        run: pnpm turbo run test -- --coverage --reporter=json --outputFile=coverage-summary.json

      - name: Upload coverage summary (even on failure)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: coverage-summary-node${{ matrix.node-version }}
          path: packages/*/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 11

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint
