name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        # pnpm 11 要求 Node ≥22.13（node:sqlite 内置模块），Node 20 已 EOL 不可用
        node-version: [22, 24]

    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # 版本由根 package.json 的 packageManager 字段决定，勿重复声明避免冲突

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build (exclude desktop)
        run: pnpm turbo run build --filter='!@zh/desktop'

      # 重构坏味道基线门禁：仅拦截「相对 .refactor-baseline.json 的新增」，
      # 存量放行（ratchet）。zhcheck 从 packages/refactor/dist 导入引擎，
      # 故必须在上一步构建之后运行。
      - name: Refactor baseline gate
        run: pnpm check:refactor:ci

      # desktop 的 injected 依赖副本在 install 时快照（早于构建，副本内无 dist），
      # 删除后重装让副本带上构建产物，desktop 类型检查才能解析 @zh/* 声明
      - name: Refresh desktop injected dependency copies
        run: rm -rf packages/desktop/node_modules && pnpm install --frozen-lockfile

      # pnpm 对 file: 目录依赖生成实体副本：已存在文件随源码更新，新增文件永不自动同步
      # （install / --force 均无效）。新增 .ts 源文件后副本会静默缺文件，
      # 下游报 "Cannot find module './xxx'" 且单跑也不过，极易误判为代码缺陷。
      - name: Check injected dependency copies are in sync
        run: pnpm check:copies

      - name: Verify dist/sop sync with kernel source
        run: pnpm --filter zhshield-cli verify:sop

      - name: Full typecheck (15 packages)
        run: pnpm typecheck

      # sop-pipeline.test.ts 的 gitleaks 用例断言 security.scan.gitleaks.hardcoded-key
      # 必须真实检出（status 'failed'），ubuntu-latest 镜像未预装 gitleaks，
      # 需在跑测试前安装到 /usr/local/bin（PATH 内）。semgrep/trivy 不装：
      # security 域测试在工具缺失时已优雅降级跳过。
      # ⚠️ 但「优雅跳过」不可用于质量门禁 —— SOP 规则质量门禁（需 semgrep）单独成 job
      #    「Rule Quality Gate」，在那里装工具 + 置 ZH_GATE_REQUIRE_SEMGREP=1。
      - name: Install gitleaks
        if: matrix.node-version == 22
        run: |
          GITLEAKS_VERSION=$(curl -s https://api.github.com/repos/gitleaks/gitleaks/releases/latest | grep '"tag_name"' | sed -E 's/.*"v([^"]+)".*/\1/')
          curl -sSL "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz" | sudo tar -xz -C /usr/local/bin gitleaks

      - name: Run all tests
        run: pnpm test

      # 端到端集成测试（pipeline 调用真实 eslint/gitleaks，~250s）
      # 默认 pnpm test 跳过（describe.skipIf !RUN_E2E）；此处显式启用，仅 node 22 跑一次
      - name: Run E2E tests (pipeline)
        if: matrix.node-version == 22
        run: RUN_E2E=1 pnpm --filter @zh/pipeline test

      - name: Format check (Prettier)
        run: pnpm format:check

      - name: Dependency audit (continue on error)
        continue-on-error: true
        run: pnpm audit --prod --audit-level=high

      - name: Run tests with coverage
        if: matrix.node-version == 22
        continue-on-error: true
        run: pnpm turbo run test -- --coverage --reporter=json --outputFile=coverage-summary.json

      - name: Upload coverage summary (even on failure)
        if: always()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: coverage-summary-node${{ matrix.node-version }}
          path: packages/*/coverage-summary.json
          if-no-files-found: ignore
          retention-days: 14

  # SOP 规则质量门禁 —— golden 断言回放（precision / recall 双阈值）
  # 机制：packages/kernel/src/sop/quality/rule-accuracy.ts
  # 用例：packages/inspect/src/__tests__/rule-quality-gate.test.ts
  #
  # 为什么单独成 job、不并进 build-and-test：
  #   ① 需要 semgrep（主 job 刻意不装，见其上注释），冷启动 + taint 扫描约 1–2 分钟
  #   ② 失败语义单一：红 = 规则质量退化，与编译/单测失败区分开
  #
  # ⚠️ 必须设 ZH_GATE_REQUIRE_SEMGREP=1 —— 否则 semgrep 缺失时门禁会「优雅跳过」→ 假绿。
  #    本项目历史上对 security 域正是「工具缺就跳过」，这个策略用在门禁上等于没有门禁。
  rule-quality-gate:
    name: Rule Quality Gate
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      # semgrep 提供 taint 数据流分析（path-traversal 规则依赖）。
      # 用 setup-python 的托管解释器：Ubuntu 24.04 系统 pip 受 PEP 668（externally-managed）限制。
      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      # 版本与本地验证基线对齐（1.172.0）。taint 分析行为随版本可能变化，
      # 升级 semgrep 必须重跑本门禁确认 precision/recall 未漂移。
      - name: Install semgrep
        run: pip install semgrep==1.172.0

      # 门禁依赖构建产物：规则资产在 packages/kernel/dist/assets/semgrep/，
      # 注入路径回退链也指向 dist；不构建则规则解析落空。
      # 构建 inspect 的依赖闭包即可覆盖（比全量构建快，且不含 desktop）。
      - name: Build inspect dependency closure
        run: pnpm turbo run build --filter=@zh/inspect...

      # 先自证工具真在 PATH：装坏了要在这里红，而不是让门禁静默跳过
      - name: Verify semgrep is available
        run: semgrep --version

      - name: Rule quality gate (golden replay)
        env:
          ZH_GATE_REQUIRE_SEMGREP: '1'
        run: pnpm --filter @zh/inspect exec vitest run src/__tests__/rule-quality-gate.test.ts

  lint:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4
        # 版本由根 package.json 的 packageManager 字段决定，勿重复声明避免冲突

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Lint
        run: pnpm lint

  # 桌面端 E2E 冒烟：Playwright 驱动真实 Electron，校验窗口/欢迎页/导航/侧边栏
  # Electron GUI 依赖 macOS，与 ubuntu 主流水线分开跑
  desktop-e2e:
    name: Desktop E2E (macOS)
    runs-on: macos-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4

      - name: Install pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4

      - name: Setup Node.js
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Build dependency packages
        run: pnpm turbo run build --filter=@zh/desktop^...

      # 与 build-desktop.yml 同款：注入副本在 install 时快照（早于构建，副本内无 dist），刷新后方可解析 @zh/* 声明
      - name: Refresh desktop injected dependency copies
        run: rm -rf packages/desktop/node_modules && pnpm install --frozen-lockfile

      - name: Build desktop app (tsc && vite build)
        run: pnpm turbo run build --filter=@zh/desktop

      - name: Run desktop E2E
        working-directory: packages/desktop
        run: pnpm exec playwright test

      - name: Upload E2E traces (on failure)
        if: failure()
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4
        with:
          name: desktop-e2e-traces-${{ github.run_id }}
          path: packages/desktop/test-results/
          if-no-files-found: ignore
          retention-days: 14
