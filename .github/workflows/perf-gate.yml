name: Perf Gate

on:
  pull_request:
  push:
    branches: [main, master]

jobs:
  perf-regression-gate:
    name: 性能基准回归门禁
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: 'pnpm'

      - name: Install dependencies
        run: pnpm install --frozen-lockfile

      - name: Generate benchmark sample fixture
        run: node scripts/fixtures/generate-sample.mjs

      - name: Run perf regression gate (PR vs baseline)
        # bench:gate = node scripts/benchmark.mjs --gate
        # 任何指标相对基线回归 >10% → exit 1，阻断合并；把「性能回归」当 bug 对待。
        run: pnpm bench:gate
