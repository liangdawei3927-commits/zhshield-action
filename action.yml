name: 'ZHCodeShield Guard'
description: '智汇码盾 — 0Token 代码质量/安全门禁 (guard/inspect)。只检查不修复，默认无 LLM / 无 token。'
author: 'zhishield'
branding:
  icon: 'shield'
  color: 'blue'
inputs:
  dir:
    description: '项目根目录 (相对仓库根，默认 ".")'
    required: false
    default: '.'
  mode:
    description: '检查模式: guard (门禁阻断) | inspect (巡检报告)'
    required: false
    default: 'guard'
  sop:
    description: '使用 SOP 规则驱动模式'
    required: false
    default: 'false'
  fail-on:
    description: '门禁阈值 (仅 guard/refactor/pipeline 生效): error | warning | info。inspect 模式固定仅报告，忽略此值'
    required: false
    default: 'error'
  format:
    description: '报告格式: sarif (默认) | json | text'
    required: false
    default: 'sarif'
outputs:
  report:
    description: '问题清单路径 (sarif/json)；text 时为空字符串'
    value: ${{ steps.run.outputs.report }}
  exit-code:
    description: 'zhshield 退出码 (0=通过, 1=阻断)'
    value: ${{ steps.run.outputs.exit-code }}
runs:
  using: 'composite'
  steps:
    - name: Setup Node.js
      uses: actions/setup-node@v4
      with:
        node-version: '22'

    # 用户 0 配置：Action 内部负责安装 CLI 与开源工具。
    # zhshield-cli 自包含 bundle 随本仓库分发包（packages/cli/dist），此处从本 Action
    # 所在的 GitHub 仓库直接下载并安装，绕开 npm 注册表（无需登录/令牌/验证码）。
    - name: Install ZHCodeShield CLI (GitHub direct)
      shell: bash
      run: |
        set -euo pipefail
        # 官方 Action 仓库是固定的；github.action_repository 在部分 runner/首次调用
        # 时可能为空，故给默认值并仅在非空时使用上下文，避免下载 URL 缺仓库名而失败。
        REPO="${GITHUB_ACTION_REPOSITORY:-liangdawei3927-commits/zhshield-action}"
        RAWREF="${GITHUB_ACTION_REF:-v1}"
        case "$RAWREF" in
          refs/tags/*|refs/heads/*) ARCHREF="$RAWREF" ;;
          *) ARCHREF="refs/tags/$RAWREF" ;;
        esac
        ARCHIVE="https://github.com/${REPO}/archive/${ARCHREF}.tar.gz"
        echo "::group::fetch zhshield-cli bundle from ${REPO}@${RAWREF}"
        rm -rf /tmp/zhshield-src
        mkdir -p /tmp/zhshield-src
        curl -fsSL "$ARCHIVE" -o /tmp/zhshield-src.tgz
        tar -xzf /tmp/zhshield-src.tgz -C /tmp/zhshield-src --strip-components=1
        # /usr/local 由 root 拥有，runner 需 sudo 写入（GitHub hosted runner 有免密 sudo）
        sudo mkdir -p /usr/local/lib/zhshield-cli
        sudo cp -f /tmp/zhshield-src/packages/cli/dist/zhshield.js /usr/local/lib/zhshield-cli/zhshield.js
        sudo rm -rf /usr/local/lib/zhshield-cli/sop
        sudo cp -r /tmp/zhshield-src/packages/cli/dist/sop /usr/local/lib/zhshield-cli/sop
        sudo chmod +x /usr/local/lib/zhshield-cli/zhshield.js
        sudo ln -sf /usr/local/lib/zhshield-cli/zhshield.js /usr/local/bin/zhshield
        echo "::endgroup::"
        zhshield 2>/dev/null | head -1 || true

    # 0Token 开源扫描器（用户无需手动安装/配置）。单工具失败不阻断整体，CLI 自动降级。
    - name: Install open-source scanners
      shell: bash
      run: |
        set -uo pipefail
        echo "::group::npm scanners (eslint/dependency-cruiser/jscpd/ts-prune/depcheck)"
        npm install -g eslint dependency-cruiser jscpd ts-prune depcheck 2>&1 | tail -n 3 || true
        echo "::endgroup::"
        echo "::group::gitleaks"
        curl -sSfL https://github.com/gitleaks/gitleaks/releases/download/v8.18.4/gitleaks_8.18.4_linux_x64.tar.gz -o /tmp/gitleaks.tgz 2>/dev/null \
          && sudo tar -xzf /tmp/gitleaks.tgz -C /usr/local/bin gitleaks 2>/dev/null || true
        echo "::endgroup::"
        echo "::group::trivy"
        curl -sSfL https://raw.githubusercontent.com/aquasecurity/trivy/main/contrib/install.sh | sudo sh -s -- -b /usr/local/bin 2>/dev/null || true
        echo "::endgroup::"
        echo "::group::semgrep"
        pip3 install --quiet semgrep 2>/dev/null || true
        echo "::endgroup::"

    # 只检查不修改代码；不开启任何 LLM / 修复 PR 步骤（防漂移约束）
    - name: Run ZHCodeShield
      id: run
      shell: bash
      run: |
        set +e
        ARGS=( "${{ inputs.mode }}" --dir "${{ inputs.dir }}" --format "${{ inputs.format }}" )
        # inspect 固定仅报告（不阻断）；guard/refactor/pipeline 才应用 fail-on 门禁
        if [ "${{ inputs.mode }}" != "inspect" ]; then ARGS+=( --fail-on "${{ inputs.fail-on }}" ); fi
        if [ "${{ inputs.sop }}" = "true" ]; then ARGS+=( --sop ); fi
        REPORT_PATH=""
        if [ "${{ inputs.format }}" = "sarif" ]; then REPORT_PATH="zhshield.sarif"; fi
        if [ "${{ inputs.format }}" = "json" ]; then REPORT_PATH="zhshield.json"; fi
        if [ -n "$REPORT_PATH" ]; then ARGS+=( --report "$REPORT_PATH" ); fi
        echo "report=$REPORT_PATH" >> "$GITHUB_OUTPUT"
        zhshield "${ARGS[@]}"
        CODE=$?
        echo "exit-code=$CODE" >> "$GITHUB_OUTPUT"
        exit $CODE
