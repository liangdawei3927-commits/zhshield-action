<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024">
  <!-- 极小尺寸档（16 / 32px）：只保留盾牌轮廓，去掉 `<_` 符号
       32px 时背景方块仅 26px、盾牌约 18px，符号已不可辨；
       留符号只会糊成一团墨点，降级为纯盾牌轮廓反而干净（符合图标小尺寸降级原则） -->
  <defs>
    <linearGradient id="zh-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#0E8C7F"/>
      <stop offset="1" stop-color="#0A6B61"/>
    </linearGradient>
  </defs>

  <rect x="102" y="102" width="820" height="820" rx="185" fill="url(#zh-bg)"/>

  <path transform="translate(204.5 185.28) scale(25.625)"
        d="M12 2L3 6.5V12C3 17.25 6.84 22.09 12 23.5C17.16 22.09 21 17.25 21 12V6.5L12 2Z"
        fill="none" stroke="#FFFFFF" stroke-width="4.2"
        stroke-linecap="round" stroke-linejoin="round"/>
</svg>
