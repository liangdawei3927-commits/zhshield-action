name: Code Comments Quality Check
description: 检查代码注释质量和覆盖率
severity: info
executionMode: async
status: active
source: official
tags: [documentation, comments]
applicableEngines: [inspect]
required:
  # 导出函数/类必须有前置 JSDoc 文档（公共 API 文档化）
  - path: src
    fileExts: ['.ts', '.tsx']
    jsdocOn:
      - '^\s*export\s+(async\s+)?function\s+'
      - '^\s*export\s+class\s+'
