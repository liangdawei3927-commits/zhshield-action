name: nestjs-backend
description: NestJS/Node.js 后端项目标准治理配置
version: "1.0"
domains:
  - eslint:enabled
  - semgrep:backend-security
  - semgrep:nestjs-patterns
  - dependency:license-check
  - dependency:vulnerability-scan
  - gitleaks:secret-detection
  - architecture:layer-boundary
tools:
  eslint:
    config: .eslintrc.js
  semgrep:
    rules: ["p/typescript", "p/nodejs", "p/security-audit"]
  gitleaks:
    enabled: true
  trivy:
    enabled: true
  dependency-cruiser:
    enabled: true
severity:
  block: [critical, high]
  warn: [medium]
  info: [low, info]
guard:
  pre_commit:
    - eslint:lint-staged
    - gitleaks:detect
    - architecture:boundary-check
  pre_push:
    - semgrep:scan
    - dependency:check
    - test:run
performance:
  max_scan_time_ms: 60000
