# =============================================================================
# SOP 规则模板 — Garbage · 死代码（未使用导出）检测
# =============================================================================
# 规则 ID: garbage.scan.cleanup.dead-code
# 治理域: 垃圾清理域 (garbage)
# 动作类型: 扫描检测 (scan)
# 数据来源: 内部模式 (internal)
# 对应适配器: Inspect · ts-prune（能力共享；触发权与判定权归垃圾清理域）
# 内部标准源: IronNest#27 No Token-Burning · #22 Reuse Before Creating
# 迁移: 2026-09-18 由 security/scan/garbage/dead-code.yml 迁入（T5 各司其职）
# =============================================================================

apiVersion: sop/v1
kind: GarbageRule
metadata:
  id: "garbage.scan.cleanup.dead-code"
  name: "死代码检测"
  description: "检测导出的函数、变量、类、类型等在代码库中没有任何调用方。死代码增加维护成本、模糊代码意图、浪费 AI Token 上下文窗口"
  version: "2.0.0"
  author: "智汇码盾官方"
  created: "2026-07-29"
  updated: "2026-09-18"
  status: "active"
  source: "internal"
  sourceRef: "IronNest rules/27 · rules/22 · ts-prune"

governance:
  domain: "garbage"
  action: "scan"
  module: "Garbage"
  category: "cleanup"

execution:
  mode: "async"
  timeout: 120
  maxConcurrency: 1
  retryCount: 0
  scope: "all"
  schedule: "on-push"

conditions:
  languages:
    - "typescript"
    - "javascript"
  filePatterns:
    - "*.ts"
    - "*.tsx"
    - "*.js"
  excludePatterns:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/*.d.ts"
    - "**/generated/**"

check:
  # ── 覆盖范围声明（诚实标注，避免"声明了却没查"）─────────────────────────────
  # 真实执行：ts-prune 报告的「导出但无引用」符号（-p 指向项目 tsconfig.json）。
  # 已移除：unreachable-code（return/throw 后的死代码）与 self-assignment ——
  #   ts-prune 不做语句级分析，二者的执行器是 ESLint（no-unreachable / no-self-assign），
  #   归门禁与项目体检域，本规则不重复声明。
  #
  # 工具参数由适配器持有（当前 TsPruneAdapter 不消费 toolConfig 的阈值），
  # 规则负责检查项、严重度、分类与修复话术。skip / ignore 由适配器直传 ts-prune：
  #   skip   → -s：判定"是否被使用"时跳过的文件（框架注册型文件，见下）
  #   ignore → -i：从报告中整体排除的路径
  tool: "ts-prune"
  toolConfig:
    skip:
      # 纯类型/声明文件：不含可执行引用关系，skip 与 ignore 等价，且输出全为类型噪音
      - "(.*\\.enum\\.ts)$"
      - "(.*\\.interface\\.ts)$"
      - "(.*\\.type\\.ts)$"
      - "(.*\\.d\\.ts)$"
    ignore:
      - "(node_modules|dist|build|coverage)/"
      # 工具约定加载的入口配置（vitest/playwright/vite.config.ts 等）由 CLI 读取而非 import，
      # 其 export default 天然零引用。必须用 ignore 而非 skip：ts-prune 的 skip 同时作用于
      # 「引用证据」与「被检查对象」（lib/analyzer.js getReferences + filterSkippedFiles），
      # skip 掉 vitest.config.ts 会连带抹掉它对 shared/src/vitest.config.base.ts 中
      # makeVitestConfig / packagesDir 的引用，使这两个真实被消费的导出反被误判为死代码。
      - ".*/(vitest|playwright|vite)\\.config\\.ts:"
      - ".*/tsconfig\\.json:"
      # NestJS 等框架以装饰器/约定注册，符号"被使用"但不出现 import。
      # 同样必须走 ignore 而非 skip：这些文件里既有装饰器注册的「隐式使用」，也有普通的
      # 函数调用与 import（如 admin-auth.guard.ts 调用 admin-token.ts 的 verifyAdminToken）。
      # skip 会把该文件对其他模块的引用一并抹掉，使被调用方反被误判为死代码。
      - ".*/[^/]*\\.(module|controller|resolver|gateway|decorator|guard|interceptor|pipe|filter|middleware)\\.ts:"
      - "(^|/)main\\.ts:"
      # refactor/security 的 __tests__/fixtures 是被检测器的测试数据：按设计就必须包含
      # 重复代码、超长函数、深嵌套等坏味道，其导出"无引用"是刻意的，不是死代码。
      - ".*/__tests__/fixtures/.*:"
      # 勿改成 (index\.ts)$：ts-prune 的 -i 匹配 presenter 拼好的整行 "file:line - symbol"
      # （runner.js `!file.match(ignore)`），行尾是符号名，$ 锚定永不命中 → ignore 静默失效，
      # barrel 误报涌入（实测 465 条 → 修正后 0 条）。
      - "(^|/)index\\.ts:"
      # browser.ts 与 index.ts 同类（纯再导出 barrel，8 行），但入口不来自 package.json main，
      # 而来自 packages/desktop/vite.config.ts 的 '@zh/kernel' → 'src/browser.ts' alias。
      # overlay 把 @zh/<pkg> 统一映射到 src/index.ts，ts-prune 静态看不到 alias 解析结果，
      # 于是该 barrel 的 7 个导出被误判为死代码。属入口 barrel，非死代码。
      - "(^|/)browser\\.ts:"
      # engineApi.ts 是渲染进程的 IPC 桥：函数经 preload contextBridge 暴露、由 ipcRenderer
      # 按 channel 字符串调用，没有一条是 import 进来的（与 NestJS 装饰器注册同类）。
      # 后端 handler 链完整（preload + ipc/*），删除会破坏 IPC 契约。
      - ".*/services/engineApi\\.ts:"
  severity: "low"
  categories:
    - "cleanup"
    - "dead-code"
    - "maintainability"

judgment:
  passCondition: "deadExportCount == 0"
  blockOn: "info"
  priority: "low"

standards:
  osps:
    - "OSPS-QS-03"
  cwe: []
  gitleaks: []

experience:
  totalHits: 0
  falsePositives: 0
  falsePositiveRate: 0.0
  avgFixTime: 120
  lastCalibrated: "2026-07-29"

fix:
  autoFixAvailable: true
  suggestionTemplate: |
    发现死代码（未使用的导出）：

    ⚠️ 文件: {file}:{line}
    ⚠️ 符号: {symbol}

    处置建议：
    1. 确认无调用方 → 删除导出或删除整个定义
    2. 如测试直接使用 → 确认测试是否引用了该导出（ts-prune 可能忽略测试文件中的引用）
    3. 如为公共 API 但尚未被消费 → 添加 `@public` 注释标注
    4. 批量清理时注意：一次删除一个符号，运行测试确认

    📖 参考: IronNest #27 No Token-Burning · ts-prune
