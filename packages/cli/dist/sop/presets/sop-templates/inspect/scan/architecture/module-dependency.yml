# =============================================================================
# SOP 规则模板 — Inspect · 模块间依赖方向巡检
# =============================================================================
# 规则 ID: inspect.scan.depcruiser.module-dependency
# 治理域: 巡检域 (inspect)
# 动作类型: 扫描检测 (scan)
# 数据来源: 内部模式 (internal)
# 对应适配器: Inspect Arch · module-dependency
# 内部标准源: dependency-cruiser · IronNest#01 Architecture · #30 Declaration Ownership
# 最后更新: 2026-07-29
# =============================================================================

apiVersion: sop/v1
kind: InspectRule
metadata:
  id: "inspect.scan.depcruiser.module-dependency"
  name: "模块间依赖方向巡检"
  description: "检查模块间依赖方向：shared/ 保持隔离不被业务模块反向依赖；控制器不得跳过中间层直接依赖仓储。由 dependency-cruiser 真实执行"
  version: "1.0.0"
  author: "智汇码盾官方"
  created: "2026-07-29"
  updated: "2026-07-29"
  status: "active"
  source: "internal"
  sourceRef: "dependency-cruiser · IronNest rules/01 · rules/30"

governance:
  domain: "inspect"
  action: "scan"
  module: "Inspect"
  category: "architecture"

execution:
  mode: "async"

conditions:
  languages:
    - "typescript"
  filePatterns:
    - "*.ts"
    - "*.tsx"
  excludePatterns:
    - "node_modules/**"
    - "dist/**"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/*.d.ts"

check:
  # ── 09-18 改造 ────────────────────────────────────────────────────────────
  # 原写法 check.tool="dep-cruiser" + toolConfig.rules（自定义 pattern/check 字段，
  # 适配器不识别）且 status=draft 从未执行。现改用 dep-cruiser 的 ruleDef 合成能力：
  # 规则即配置，扫描时注入临时 --config 真实执行。
  #
  # 覆盖范围声明：
  #   ✓ shared-module-isolation（shared 不得依赖业务模块）→ ruleDef 真实执行
  #   ✓ layer-skip（控制器直接依赖仓储，跳过中间层）      → ruleDef 真实执行
  #   ✗ cross-module-internal-path / module-circular → 已由「模块边界」规则覆盖，
  #     同一违规两处上报会被读作误报，此处不再重复声明
  #   ✗ bounded-context-coupling / module-folder-count → 需语义与计数能力，
  #     dep-cruiser 不支持，已移除
  tool: "dep-cruiser"
  toolConfig:
    config: ".dependency-cruiser.cjs"
  rules:
    - id: "shared-module-isolation"
      description: "shared/ 不得依赖业务模块，应保持无业务语义的公共库"
      severity: "error"
      ruleDef:
        from:
          path: "^src/shared/"
        to:
          path: "^src/(modules|features|domains|services)/"
    - id: "layer-skip"
      description: "控制器不得直接依赖仓储层（跳过 use-case/service）"
      severity: "warning"
      ruleDef:
        from:
          path: "/controllers/"
        to:
          path: "/repositories/"
  severity: "warning"
  categories:
    - "architecture"
    - "module-dependency"

judgment:
  passCondition: "errorCount === 0"
  blockOn: "error"
  priority: "medium"

standards:
  osps:
    - "OSPS-QS-03"
  cwe: []
  gitleaks: []

experience:
  totalHits: 0
  falsePositives: 0
  falsePositiveRate: 0.0
  avgFixTime: 1200
  lastCalibrated: "2026-07-29"

fix:
  autoFixAvailable: false
  suggestionTemplate: |
    发现模块依赖方向违规：

    ⚠️ 文件: {file}:{line}
    ⚠️ 违规类型: {ruleId}
    ⚠️ 依赖链: {source} → {target}

    修复指引：
    1. 跨模块内部路径 → 通过 `index.ts` 导出公共 API，外部模块只引用 public API
    2. Shared 隔离 → 将 shared 从业务模块中解耦，shared 仅依赖核心库
    3. 循环依赖 → 提取公共接口到 shared-kernel，或通过事件解耦
    4. 层跳过 → controller → use-case → service → domain → repository/adapter

    📖 参考: dependency-cruiser 规则集 · IronNest #01 架构 · #30 声明所有权
