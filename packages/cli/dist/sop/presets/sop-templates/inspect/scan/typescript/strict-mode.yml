# =============================================================================
# SOP 规则模板 — Inspect · TypeScript 严格模式配置检查
# =============================================================================
# 规则 ID: inspect.scan.internal.strict-mode
# 治理域: 巡检域 (inspect)
# 动作类型: 扫描检测 (scan)
# 数据来源: 内部模式 (internal)
# 对应适配器: Inspect TS · strict-mode
# 内部标准源: TypeScript strict config · IronNest#13 ESLint+TypeScript
# 最后更新: 2026-10-21（补 metadata.tags=typescript，栈限定随画像裁剪）
# =============================================================================

apiVersion: sop/v1
kind: InspectRule
metadata:
  id: "inspect.scan.internal.strict-mode"
  name: "TypeScript 严格模式配置检查"
  description: "检查 tsconfig.json 是否启用 strict、noUncheckedIndexedAccess、exactOptionalPropertyTypes 三项关键严格标志"
  version: "1.1.0"
  author: "智汇码盾官方"
  created: "2026-07-29"
  updated: "2026-10-21"
  status: "active"
  source: "internal"
  sourceRef: "TypeScript strict · IronNest rules/13"
  # 栈限定标签：TypeScript 独占栈规则，必须声明，否则 ruleMatchesProject 按"通用规则"处理，
  # 对不含 TypeScript 的项目（文档仓 / 纯资源仓）也会评估并报「缺少 tsconfig.json」误报。
  # 与云端同源规则 inspect.scan.official.strict-mode 的 tags 口径一致。
  tags:
    - "typescript"

governance:
  domain: "inspect"
  action: "scan"
  module: "Inspect"
  category: "typescript"

execution:
  mode: "async"
  timeout: 30
  maxConcurrency: 1
  retryCount: 0
  scope: "all"
  schedule: "on-push"

conditions:
  languages:
    - "typescript"
    - "json"
  filePatterns:
    - "tsconfig.json"
    - "tsconfig.build.json"
    - "tsconfig.base.json"
  excludePatterns: []

check:
  # ── 09-18 改造 ────────────────────────────────────────────────────────────
  # 原写法 check.tool="tsc-config-validator"（不存在）且 status=draft 从未执行。
  # 现改用内核 required-content 的 JSON 键路径检查（compilerOptions.<flag> === true），
  # 直接解析 JSONC（容忍注释与尾逗号）。
  #
  # 覆盖范围声明：
  #   ✓ strict / noUncheckedIndexedAccess / exactOptionalPropertyTypes
  #     —— 后两项是 strict: true 不覆盖、但对空安全影响最大的标志，真实执行
  #   ✗ 其余标志（strictNullChecks / strictFunctionTypes / noImplicitReturns 等）
  #     → 均被 strict: true 隐含，重复要求显式声明会误报（合理配置无需重复写），已移除
  #
  # 已知边界：仅检查仓库根的 tsconfig.json；若严格标志定义在 extends 的 base 配置中，
  # 本项会对根配置误报（表现为"缺少配置项"而非"未开启"）。
  required:
    - path: "tsconfig.json"
      json:
        "compilerOptions.strict": true
        "compilerOptions.noUncheckedIndexedAccess": true
        "compilerOptions.exactOptionalPropertyTypes": true
  severity: "error"
  categories:
    - "typescript"
    - "strict-mode"

judgment:
  passCondition: "criticalErrorCount === 0"
  blockOn: "error"
  priority: "high"

standards:
  osps:
    - "OSPS-QS-03"
  cwe:
    - "CWE-1104"
    - "CWE-476"
  gitleaks: []

experience:
  totalHits: 0
  falsePositives: 0
  falsePositiveRate: 0.0
  avgFixTime: 300
  lastCalibrated: "2026-07-29"

fix:
  autoFixAvailable: true
  suggestionTemplate: |
    检测到 TypeScript 严格模式标志未启用：

    ⚠️ 文件: {file}
    ⚠️ 缺失标志: {missingFlag}
    ⚠️ 描述: {description}

    修复方法：在 tsconfig.json 中添加缺失标志：

    {
      "compilerOptions": {
        "{missingFlag}": true
      }
    }

    推荐的最小严格配置：
    {
      "compilerOptions": {
        "strict": true,
        "strictNullChecks": true,
        "noUncheckedIndexedAccess": true,
        "exactOptionalPropertyTypes": true,
        "strictFunctionTypes": true,
        "noImplicitReturns": true,
        "noFallthroughCasesInSwitch": true
      }
    }

    启用后运行 `npx tsc --noEmit` 确认无新增错误。

    📖 参考: TypeScript Strict Mode · IronNest #13
