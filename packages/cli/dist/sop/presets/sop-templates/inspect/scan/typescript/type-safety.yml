# =============================================================================
# SOP 规则模板 — Inspect · TypeScript 类型安全性扫描
# =============================================================================
# 规则 ID: inspect.scan.internal.type-safety
# 治理域: 巡检域 (inspect)
# 动作类型: 扫描检测 (scan)
# 数据来源: 内部模式 (internal)
# 对应适配器: Inspect TS · type-safety
# 内部标准源: IronNest#00 Non-negotiable · IronNest#13 ESLint+TypeScript · IronNest#25 No Clever TS
# 最后更新: 2026-07-29
# =============================================================================

apiVersion: sop/v1
kind: InspectRule
metadata:
  id: "inspect.scan.internal.type-safety"
  name: "TypeScript 类型安全性扫描"
  description: "扫描 any 类型的显式使用（: any / <any> / any[]）。断言类（as any）由「类型一致性」规则负责"
  version: "1.0.0"
  author: "智汇码盾官方"
  created: "2026-07-29"
  updated: "2026-07-29"
  status: "active"
  source: "internal"
  sourceRef: "IronNest rules/00 · rules/13 · rules/25"

governance:
  domain: "inspect"
  action: "scan"
  module: "Inspect"
  category: "typescript"

execution:
  mode: "async"
  timeout: 60
  maxConcurrency: 2
  retryCount: 0
  scope: "all"
  schedule: "on-push"

conditions:
  languages:
    - "typescript"
  filePatterns:
    - "*.ts"
    - "*.tsx"
  excludePatterns:
    - "node_modules/**"
    - "dist/**"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/*.d.ts"
    - "**/generated/**"

check:
  # ── 09-18 改造 ────────────────────────────────────────────────────────────
  # 原写法 check.tool="custom-ast-scanner"（不存在）且 status=draft 从未执行。
  # 现改用内核 forbiddenRegex 内联评估器。
  #
  # 与「类型一致性」规则切分（避免同一违规两处上报）：
  #   type-consistency → 断言类：as any / as unknown as / 无类型注解参数
  #   本条（type-safety）→ any 类型的**显式使用**：: any / <any> / any[]
  #
  # 覆盖范围声明：
  #   ✓ no-explicit-any（显式声明 any 类型）              → 真实执行
  #   ✗ explicit-return-type / inferred-any-leak / unsafe-generic / 复杂条件类型嵌套
  #     → 需 AST 与控制流，正则会大量误报，已移除；
  #       由 tsconfig strict + @typescript-eslint/no-explicit-any 覆盖
  forbiddenRegex:
    - regex: "(?::\\s*any\\b|<\\s*any\\s*>|\\bany\\[\\])"
      message: "显式使用 any 类型（关闭该处类型检查）"
      suggestion: "改用 unknown + 类型守卫，或声明精确类型 / 泛型约束"
  fileExts:
    - ".ts"
    - ".tsx"
  excludePatterns:
    - "**/*.spec.ts"
    - "**/*.test.ts"
    - "**/*.d.ts"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/generated/**"
  severity: "warning"
  categories:
    - "type-safety"
    - "typescript"

judgment:
  passCondition: "errorCount === 0"
  blockOn: "error"
  priority: "medium"

standards:
  osps:
    - "OSPS-QS-03"
  cwe:
    - "CWE-1104"
  gitleaks: []

experience:
  totalHits: 0
  falsePositives: 0
  falsePositiveRate: 0.0
  avgFixTime: 600
  lastCalibrated: "2026-07-29"

fix:
  autoFixAvailable: false
  suggestionTemplate: |
    发现类型安全性违规：

    ⚠️ 文件: {file}:{line}
    ⚠️ 规则: {ruleId}
    ⚠️ 详情: {description}

    修复建议：
    1. any → unknown + 类型 narrowing（typeof / instanceof / 自定义 type guard）
    2. as 断言 → 使用 Zod/class-validator parse 后由框架保证类型
    3. 显式返回类型 → `public method(): ReturnType { ... }`
    4. 复杂条件类型 → 拆分为具名类型，简化嵌套层级

    📖 参考: IronNest #00 不可协商规则 · #13 ESLint/TS · #25 不玩花样 TS
