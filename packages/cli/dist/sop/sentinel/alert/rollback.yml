name: Auto Rollback Strategy
description: 自动回滚策略 — 新版本发布后出现 critical 错误时触发
severity: critical
executionMode: event
status: active
source: official
tags: [sentinel, rollback, deploy]
applicableEngines: [sentinel]
conditions:
  - errorRate: '> 5%'
  - p99Latency: '> 5000ms'
  - crashRate: '> 0.1%'
cooldownPeriod: 300000  # 5 分钟（毫秒）
