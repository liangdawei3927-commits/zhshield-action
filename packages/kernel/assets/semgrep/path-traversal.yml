# 智汇码盾 — Semgrep 路径穿越（Path Traversal, CWE-22）检测规则
#
# 机制同 redos.yml：可由 SOP 规则经 SemgrepAdapter 以 `--config <本文件>` 注入扫描
# （参考 inspect.scan.performance.semgrep-redos 对 redos.yml 的引用方式）。
#
# 本文件承担两件事：
#   1) detect-path-traversal：标记 raw `path.join` / `path.resolve` 调用，提示改用
#      @zh/shared 的 safeJoin / safeResolve（防 CWE-22 路径穿越）。
#   2) allowlist：paths.exclude 排除"非发布 / 测试 fixture / 受控补全器"等已知项，
#      对应安全分诊报告中 12 个 P3 项，使 recurring 扫描基线收敛。
#
# ⚠️ 状态：report-only（severity: WARNING），尚未在 CI 用真实语料验证误报率。
#   提升为阻断前，需在 CI 跑一次 semgrep 并据此收敛（见底部 tuning 说明）。
#   当前本文件未被任何 SOP 规则引用（草稿态）；接入方式见底部。

rules:
  - id: detect-path-traversal
    message: >-
      检测到 `path.join` / `path.resolve` 调用。若任一片段可能来自外部/不可信输入
      （用户、HTTP 请求、文件名、仓库名、扫描目标等），存在路径穿越（CWE-22）风险。
      请改用 @zh/shared 的 `safeJoin(base, ...segments)` / `safeResolve(base, target)`，
      二者在目标逃出 base 时会抛出 PathTraversalError。
    metadata:
      owasp:
        - A01:2021 - Broken Access Control
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      category: security
      technology:
        - javascript
        - typescript
      confidence: MEDIUM
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: path.join(...)
          - pattern: path.resolve(...)
    paths:
      exclude:
        - "**/__tests__/**"
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "packages/shared/src/path-augment.ts"   # 受控 PATH 补全器，非攻击面
        # —— 分诊报告 P3 非发布项（允许列表，与报告 §3.8 对应）——
        - "packages/fingerprint/src/__tests__/scoring-profile.test.ts"
        - "packages/sentinel/src/__tests__/log-collector.test.ts"
        - "packages/kernel/scripts/copy-sop-rules.cjs"

# ───────────────────────────────────────────────────────────────────────────
# 接入方式（草稿，待 CI 验证后启用）：
#   在 SOP 规则中新增一项，复用 SemgrepAdapter，将 config 指向本文件，例如：
#     inspect.scan.security.path-traversal:
#       check.toolConfig.config: "packages/kernel/assets/semgrep/path-traversal.yml"
#   先以 severity WARNING（report-only）运行若干次，统计误报；误报收敛后再考虑
#   提升为 ERROR/阻断。本地开发机若无 semgrep，本规则不会被触发，不影响 pnpm lint/build。
# ───────────────────────────────────────────────────────────────────────────
