# 智汇码盾 — Semgrep 路径穿越（Path Traversal, CWE-22）检测规则
#
# 机制同 redos.yml：可由 SOP 规则经 SemgrepAdapter 以 `--config <本文件>` 注入扫描
# （参考 inspect.scan.performance.semgrep-redos 对 redos.yml 的引用方式）。
#
# 本文件承担两件事：
#   1) detect-path-traversal：标记 raw `path.join` / `path.resolve` 调用，提示改用
#      @zh/shared 的 safeJoin / safeResolve（防 CWE-22 路径穿越）。
#   2) allowlist：paths.exclude 排除"非发布 / 测试 fixture / 受控补全器"等已知项，
#      对应安全分诊报告中 12 个 P3 项，使 recurring 扫描基线收敛。
#
# 状态：report-only（severity: WARNING），已通过 SOP 规则
#   src/sop/inspect/scan/security/path-traversal.yml 接入 inspect 引擎
#   （toolConfig.config 指向 dist/assets/semgrep/path-traversal.yml）。
#   提升为阻断前，需在 CI 跑一次 semgrep 统计误报率并据此收敛。
#   注意：join(...)/resolve(...) 解构写法可能误报（如 Array.prototype.join），当前 report-only 可接受。

rules:
  - id: detect-path-traversal
    message: >-
       检测到 `path.join` / `path.resolve` 调用（含解构写法 `import { join } from 'path'` 后的 `join(...)` / `resolve(...)`）。若任一片段可能来自外部/不可信输入
      （用户、HTTP 请求、文件名、仓库名、扫描目标等），存在路径穿越（CWE-22）风险。
      请改用 @zh/shared 的 `safeJoin(base, ...segments)` / `safeResolve(base, target)`，
      二者在目标逃出 base 时会抛出 PathTraversalError。
    metadata:
      owasp:
        - A01:2021 - Broken Access Control
      cwe:
        - "CWE-22: Improper Limitation of a Pathname to a Restricted Directory"
      category: security
      technology:
        - javascript
        - typescript
      confidence: MEDIUM
    languages:
      - javascript
      - typescript
    severity: WARNING
    patterns:
      - pattern-either:
          - pattern: path.join(...)
          - pattern: path.resolve(...)
          - pattern: join(...)
          - pattern: resolve(...)
    paths:
      exclude:
        - "**/__tests__/**"
        - "**/*.test.ts"
        - "**/*.spec.ts"
        - "packages/shared/src/path-augment.ts"   # 受控 PATH 补全器，非攻击面
        # —— 分诊报告 P3 非发布项（允许列表，与报告 §3.8 对应）——
        - "packages/fingerprint/src/__tests__/scoring-profile.test.ts"
        - "packages/sentinel/src/__tests__/log-collector.test.ts"
        - "packages/kernel/scripts/copy-sop-rules.cjs"

# ───────────────────────────────────────────────────────────────────────────
# 接入方式（已实现）：已新增 SOP 规则 src/sop/inspect/scan/security/path-traversal.yml，
#   复用 SemgrepAdapter，toolConfig.config 指向
#   node_modules/@zh/kernel/dist/assets/semgrep/path-traversal.yml（由 copy-sop-rules.cjs
#   从本文件拷贝到 dist/assets/semgrep/）。先以 severity WARNING（report-only）运行，
#   统计误报；误报收敛后再考虑提升为 ERROR/阻断。本地若无 semgrep 则本规则不触发，
#   不影响 pnpm lint/build。
# ───────────────────────────────────────────────────────────────────────────
