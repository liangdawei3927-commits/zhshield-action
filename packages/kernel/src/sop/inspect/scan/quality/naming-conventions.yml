name: Naming Conventions
description: 检查代码命名规范一致性
severity: info
executionMode: async
status: active
source: official
tags: [naming, convention, style]
applicableEngines: [inspect]
rules:
  - class: PascalCase
  - function: camelCase
  - variable: camelCase
  - constant: UPPER_CASE
  - interface: PascalCase
  - type: PascalCase
  - file: kebab-case
