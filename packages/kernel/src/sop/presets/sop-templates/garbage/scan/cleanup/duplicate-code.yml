# =============================================================================
# SOP 规则模板 — Garbage · 重复代码检测
# =============================================================================
# 规则 ID: garbage.scan.cleanup.duplicate-code
# 治理域: 垃圾清理域 (garbage)
# 动作类型: 扫描检测 (scan)
# 数据来源: 内部模式 (internal)
# 对应适配器: Inspect · jscpd（能力共享；触发权与判定权归垃圾清理域）
# 内部标准源: IronNest#22 Reuse Before Creating · #26 Helper-Driven Maintainability
# 迁移: 2026-09-18 由 security/scan/garbage/duplicate-code.yml 迁入（T5 各司其职）
# =============================================================================

apiVersion: sop/v1
kind: GarbageRule
metadata:
  id: "garbage.scan.cleanup.duplicate-code"
  name: "重复代码检测"
  description: "检测跨文件重复的代码片段，提示提取为共享 Helper。重复代码增加维护成本、不一致风险与 AI 上下文噪声"
  version: "2.0.0"
  author: "智汇码盾官方"
  created: "2026-07-29"
  updated: "2026-09-18"
  status: "active"
  source: "internal"
  sourceRef: "IronNest rules/22 · rules/26 · jscpd"

governance:
  domain: "garbage"
  action: "scan"
  module: "Garbage"
  category: "cleanup"

execution:
  mode: "async"
  timeout: 180
  maxConcurrency: 1
  retryCount: 0
  scope: "all"
  schedule: "weekly"

conditions:
  languages:
    - "typescript"
    - "javascript"
    - "python"
    - "go"
    - "rust"
    - "shell"
  filePatterns:
    - "*.ts"
    - "*.tsx"
    - "*.js"
    - "*.py"
    - "*.go"
    - "*.rs"
    - "*.sh"
  excludePatterns:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - "coverage/**"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/*.d.ts"
    - "**/generated/**"
    - "**/*.min.*"

check:
  # ── 覆盖范围声明（诚实标注）───────────────────────────────────────────────
  # 真实执行：jscpd --mode strict 报告的重复代码块（阈值与 ignore 由 JscpdAdapter
  #   持有：适配器不消费 toolConfig，故此处不声明会被忽略的 minLines / minTokens）。
  # 本规则与「代码重构」域的重复检测分工：
  #   · 本规则 = 清理视角：跨文件重复片段的"可提取为 Helper"清单
  #   · 重构域   = 重构视角：AST 级异味与结构化重构建议（含圈复杂度等）
  #   二者若同时运行会各自上报，属已知重叠；合并去重不在本规则职责内。
  tool: "jscpd"
  severity: "low"
  categories:
    - "cleanup"
    - "duplicate"
    - "maintainability"
    - "refactoring"

judgment:
  passCondition: "duplicateCount == 0"
  blockOn: "info"
  priority: "low"

standards:
  osps:
    - "OSPS-QS-03"
  cwe:
    - "CWE-1104"
  gitleaks: []

experience:
  totalHits: 0
  falsePositives: 0
  falsePositiveRate: 0.0
  avgFixTime: 600
  lastCalibrated: "2026-07-29"

fix:
  autoFixAvailable: false
  suggestionTemplate: |
    检测到重复代码：

    ⚠️ 文件 A: {fileA}:{lineA}
    ⚠️ 文件 B: {fileB}:{lineB}

    修复建议：
    1. 提取公共逻辑到共享 Helper（参考 IronNest #26）
       - 函数提取 → `lib/` 或 `helpers/` 目录
       - 多段重复 → 搜索已有 Helper 优先扩展
    2. 不应提取的场景（见 #26 §Do not extract）：
       - 仅 1-2 行简单比较
       - 包装后反而不清晰的抽象
       - 接受 repository/SDK 参数试图掩盖层级违规

    📖 参考: IronNest #22 复用优先 · #26 Helper 维护性 · jscpd
