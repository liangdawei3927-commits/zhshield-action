# =============================================================================
# SOP 规则模板 — Inspect · 架构边界检查（循环依赖）
# =============================================================================
# 规则 ID: inspect.scan.depcruiser.circular-dependency
# 治理域: 巡检域 (inspect)
# 动作类型: 扫描检测 (scan)
# 数据来源: dependency-cruiser (外部标准)
# 对应适配器: Inspect 架构检查 · circular-dependency
# 外部标准源: dependency-cruiser no-circular 规则 + SDP 原则
# =============================================================================

apiVersion: sop/v1
kind: InspectRule
metadata:
  id: "inspect.scan.depcruiser.circular-dependency"
  name: "循环依赖检测"
  description: "检测模块间的循环依赖关系，确保依赖图是有向无环图（DAG）"
  version: "1.0.0"
  author: "智汇码盾官方"
  created: "2026-07-29"
  updated: "2026-07-29"
  status: "active"
  source: "external"
  sourceRef: "dependency-cruiser rules-reference.md — no-circular"

governance:
  domain: "inspect"
  action: "scan"
  module: "Inspect"
  adapter: "architecture"
  checker: "circular-dependency"
  mode: "full"

execution:
  mode: "sync"
  timeout: 30
  maxConcurrency: 1
  retryCount: 0
  scope: "all"

conditions:
  languages:
    - "typescript"
  filePatterns:
    - "src/**/*.ts"
    - "src/**/*.tsx"
  excludePatterns:
    - "node_modules/**"
    - "dist/**"
    - "**/*.spec.ts"
    - "**/*.test.ts"
    - "coverage/**"

check:
  tool: "dependency-cruiser"
  toolConfig:
    configFile: ".dependency-cruiser.cjs"
    outputType: "err-long"
    exitCode: 1
  rules:
    - id: "no-circular"
      description: "禁止任何形式的循环依赖"
      severity: "error"
      ruleDef:
        from: {}
        to:
          circular: true
    - id: "no-utils-to-features"
      description: "工具层不能依赖业务层"
      severity: "error"
      ruleDef:
        from:
          path: "^src/utils"
        to:
          path: "^src/(features|pages)"
    - id: "layer-boundary"
      description: "层依赖方向必须遵守（controller→service→repository）"
      severity: "error"
      ruleDef:
        from:
          path: "/(routes|handlers|controllers)/"
        to:
          path: "/(repositories|repo)/"
    - id: "stable-dependency"
      description: "稳定依赖原则：不稳定的模块可以依赖稳定的模块，反之不行"
      severity: "warning"
  severity: "error"

standards:
  depcruiser:
    - "rules-reference.md — no-circular"
    - "rules-reference.md — from/to path matching"
  ironnest:
    - "Rule #11: Organize by feature, not by layer"
  osps: []

judgment:
  passCondition: "circularCount === 0 && boundaryViolationCount === 0"
  maxIssues: 10
  priority: "high"
  scoring:
    penalty: 20                 # 循环依赖额外扣 20 分（设计文档定义）

score:
  impact: "architecture"
  weight: 0.12

fix:
  autoFixAvailable: false
  suggestionTemplate: |
    检测到循环依赖：
    🔄 循环链: {chain}

    修复策略：
    1. ⭐ 提取公共依赖到共享模块 (@zh/shared)
    2. ⭐ 使用依赖倒置（依赖接口而非具体实现）
    3. ⭐ 合并相互依赖的模块
    4. 评估是否真的需要双向依赖

    示例：
    ```typescript
    // ❌ 循环依赖：A → B → A
    // ✅ A → SharedInterface ← B
    ```
