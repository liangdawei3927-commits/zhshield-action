# =============================================================================
# SOP 规则模板 — Inspect · 架构分层合规巡检
# =============================================================================
# 规则 ID: inspect.scan.depcruiser.layer-boundary
# 治理域: 巡检域 (inspect)
# 动作类型: 扫描检测 (scan)
# 数据来源: 内部模式 (internal)
# 对应适配器: Inspect Arch · layer-boundary
# 内部标准源: dependency-cruiser + IronNest#01 (Architecture) + IronNest#03 (Application Services)
# 最后更新: 2026-07-29
# =============================================================================

apiVersion: sop/v1
kind: InspectRule
metadata:
  id: "inspect.scan.depcruiser.layer-boundary"
  name: "架构分层合规巡检"
  description: "扫描项目源码的层间依赖方向合规性：控制器/用例/服务/仓储/适配器/领域/共享层之间必须符合单向依赖约束。前提是项目按目录分层（层名即目录名）"
  version: "1.0.0"
  author: "智汇码盾官方"
  created: "2026-07-29"
  updated: "2026-07-29"
  status: "active"
  source: "internal"
  sourceRef: "dependency-cruiser · IronNest rules/01 · rules/03 · rules/04"

governance:
  domain: "inspect"
  action: "scan"
  module: "Inspect"
  category: "architecture"

execution:
  mode: "async"

conditions:
  languages:
    - "typescript"
    - "javascript"
  filePatterns:
    - "*.ts"
    - "*.tsx"
  excludePatterns:
    - "node_modules/**"
    - "dist/**"
    - "**/*.test.ts"
    - "**/*.spec.ts"
    - "**/*.d.ts"
    - "**/generated/**"

check:
  # ── 09-18 改造：从「声明了却没查」变为真实执行 ──────────────────────────────
  # 原写法 check.tool="dep-cruiser" + toolConfig.scanRules（内核与适配器均不识别
  # scanRules 结构），且 status=draft 从未进入执行集。现改用内核 layer-boundary
  # 内联评估器：零外部二进制、毫秒级出结果，直接解析源码 import 语句判定层间方向。
  #
  # 覆盖范围声明（诚实标注，避免第二次「声明了却没查」）：
  #   ✓ layer-violation（层间依赖方向违规）    → 本评估器真实执行
  #   ✗ service-cohesion（方法/文件过长）      → 属「代码重构」域 long-method 职责，移除以免跨域重复
  #   ✗ use-case-purity / controller-thickness → 需 AST 与控制流语义，纯正则误报率高，已移除
  #
  # 前提：项目按目录分层（src/<layer>/…），层名即目录名。未采用分层目录的项目不产生结论。
  layers:
    - name: "controllers"
      allowedDependencies: ["services", "use-cases", "dto"]
    - name: "use-cases"
      allowedDependencies: ["services", "domain", "dto"]
    - name: "services"
      allowedDependencies: ["domain", "repositories", "adapters", "shared"]
    - name: "repositories"
      allowedDependencies: ["domain", "shared"]
    - name: "adapters"
      allowedDependencies: ["domain", "shared", "core"]
    - name: "domain"
      allowedDependencies: ["shared"]
    - name: "shared"
      allowedDependencies: []
  excludePatterns:
    - "**/*.spec.ts"
    - "**/*.test.ts"
    - "**/*.d.ts"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/coverage/**"
    - "**/generated/**"
  severity: "warning"
  categories:
    - "architecture"
    - "layer-compliance"

judgment:
  passCondition: "criticalErrorCount === 0"
  blockOn: "error"
  priority: "high"

standards:
  osps:
    - "OSPS-QS-03"    # Code Quality Standards
    - "OSPS-AC-01"    # Access Control Policy
  cwe: []
  gitleaks: []

experience:
  totalHits: 0
  falsePositives: 0
  falsePositiveRate: 0.0
  avgFixTime: 600
  lastCalibrated: "2026-07-29"

fix:
  autoFixAvailable: false
  suggestionTemplate: |
    发现架构分层违规：

    ⚠️ 文件: {file}:{line}
    ⚠️ 违规类型: {ruleId}
    ⚠️ 违规详情: {detail}

    按 IronNest 架构规则修复：
    1. 层次违规 → 检查目标层是否在允许的依赖列表中，不在则抽取到正确层
    2. Service 过厚 → ≤20 行/方法，考虑提取 helper 或拆到 use-case
    3. Controller 含逻辑 → 委托给 use-case，控制器仅做路由和参数提取
    4. Use-case 含基础设施导入 → 包装在 adapter 中，use-case 只调用 adapter 接口

    📖 参考: IronNest #01 架构边界 · #03 应用服务 · #04 仓库层
