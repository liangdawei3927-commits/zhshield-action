# =============================================================================
# SOP 规则模板 — Inspect · NestJS 依赖注入合规巡检
# =============================================================================
# 规则 ID: inspect.scan.ironnest.dependency-injection
# 治理域: 巡检域 (inspect)
# 动作类型: 扫描检测 (scan)
# 数据来源: 内部模式 (internal)
# 对应适配器: Inspect NestJS · DI
# 内部标准源: IronNest#04 (Repository) + IronNest#12 (Library Wrapping) + NestJS 最佳实践
# 最后更新: 2026-07-29
# =============================================================================

apiVersion: sop/v1
kind: InspectRule
metadata:
  id: "inspect.scan.ironnest.dependency-injection"
  name: "NestJS 依赖注入合规巡检"
  description: "检查 NestJS 依赖注入合规性：禁止 forwardRef 循环依赖、禁止业务代码直接实例化外部库、禁止直接注入 HTTP 客户端"
  version: "1.0.0"
  author: "智汇码盾官方"
  created: "2026-07-29"
  updated: "2026-07-29"
  status: "active"
  source: "internal"
  sourceRef: "IronNest rules/04 · rules/12 · NestJS documentation"

governance:
  domain: "inspect"
  action: "scan"
  module: "Inspect"
  category: "nestjs"

execution:
  mode: "async"

conditions:
  languages:
    - "typescript"
  filePatterns:
    - "*.ts"
  excludePatterns:
    - "node_modules/**"
    - "dist/**"
    - "**/*.test.ts"
    - "**/*.spec.ts"
    - "**/*.d.ts"

check:
  # ── 09-18 改造 ────────────────────────────────────────────────────────────
  # 原写法 check.tool="custom-ast-scanner" 指向**不存在的工具**（无任何适配器注册），
  # 且 status=draft 从未执行。现改用内核 forbiddenRegex 内联评估器
  # （逐行匹配，扫描前自动剥离字符串字面量与注释，避免误报）。
  #
  # 覆盖范围声明：
  #   ✓ circular-di（forwardRef 循环依赖坏味道）              → 真实执行
  #   ✓ adapter-vendor-separation（业务代码直接实例化外部库）  → 真实执行
  #   ✓ http-service-import（直接注入 HTTP 客户端）           → 真实执行
  #   ✗ provider-scope（缺 @Injectable 装饰器）→ 需 AST 语义与跨文件解析，
  #     正则会大量误报，已移除；由 @typescript-eslint 与 NestJS 启动期校验覆盖
  forbiddenRegex:
    - regex: "\\bforwardRef\\s*\\("
      message: "使用 forwardRef 解决循环依赖（NestJS 坏味道）"
      suggestion: "重构模块边界消除循环；确需双向引用时提取共享接口到 shared-kernel"
    - regex: "new\\s+(?:PrismaClient|Redis|Stripe|S3Client|OpenAI|Anthropic)\\b"
      message: "业务代码直接实例化外部库，应通过 Adapter 注入"
      suggestion: "在 adapters/ 中封装（如 payment.adapter.ts），业务层只依赖接口"
    - regex: "@Inject\\s*\\(\\s*(?:HttpService|AxiosInstance)\\s*\\)"
      message: "直接注入 HTTP 客户端，应通过 Adapter 封装"
      suggestion: "定义 HttpClientPort 接口，由 adapter 实现具体协议"
  fileExts:
    - ".ts"
  excludePatterns:
    - "**/*.adapter.ts"
    - "**/*.spec.ts"
    - "**/*.test.ts"
    - "**/*.d.ts"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/generated/**"
  severity: "warning"
  categories:
    - "dependency-injection"
    - "nestjs"

judgment:
  passCondition: "errorCount === 0"
  blockOn: "error"
  priority: "high"

standards:
  osps:
    - "OSPS-QS-03"    # Code Quality Standards
    - "OSPS-SH-01"    # Secure Configuration
  cwe: []
  gitleaks: []

experience:
  totalHits: 0
  falsePositives: 0
  falsePositiveRate: 0.0
  avgFixTime: 600
  lastCalibrated: "2026-07-29"

fix:
  autoFixAvailable: false
  suggestionTemplate: |
    发现 NestJS 依赖注入违规：

    ⚠️ 文件: {file}:{line}
    ⚠️ 违规类型: {ruleId}
    ⚠️ 详情: {detail}

    修复建议：
    1. Provider scope → 确认 `@Injectable()` 装饰器存在，无特殊需求使用默认 singleton
    2. 循环依赖 → 使用 `forwardRef(() => Module)` 或重构模块边界消除循环
    3. 外部库直注 → 创建 Adapter（如 `payment.adapter.ts`），接口定义在 `domain/`，实现在 `adapters/`
    4. HTTP 客户端 → 通过 `HttpAdapter` 封装，业务层只依赖接口

    📖 参考: IronNest #04 仓库模式 · #12 库封装与适配器
