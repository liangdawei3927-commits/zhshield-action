# =============================================================================
# SOP 规则模板 — Inspect · NestJS 模块边界检查
# =============================================================================
# 规则 ID: inspect.scan.ironnest.module-boundary
# 治理域: 巡检域 (inspect)
# 动作类型: 扫描检测 (scan)
# 数据来源: IronNest (外部标准)
# 对应适配器: Inspect NestJS 适配器 · module-boundary
# 外部标准源: IronNest #1 — module isolation + barrel export
# =============================================================================

apiVersion: sop/v1
kind: InspectRule
metadata:
  id: "inspect.scan.ironnest.module-boundary"
  name: "NestJS 模块边界检查"
  description: "检查 NestJS 模块间是否通过 index.ts (barrel) 导出，禁止直接跨模块 import 内部文件"
  version: "1.0.0"
  author: "智汇码盾官方"
  created: "2026-07-29"
  updated: "2026-07-29"
  status: "active"
  source: "external"
  sourceRef: "IronNest AGENTS.md — Rule #1: Module isolation + barrel exports"

governance:
  domain: "inspect"
  action: "scan"
  module: "Inspect"
  adapter: "nestjs"
  checker: "module-boundary"
  mode: "full"

execution:
  mode: "sync"
  timeout: 30
  maxConcurrency: 4
  retryCount: 0
  scope: "all"

conditions:
  languages:
    - "typescript"
  # 声明规则的适用面。注意：实际扫描目标由 dep-cruiser 适配器按 targetDirs
  # （项目的 src/，monorepo 则为各 packages/*/src）决定，本字段尚未透传到适配器。
  # 原写法 "src/features/*/.ts" 缺少通配符，glob 无法命中任何文件，一并修正。
  filePatterns:
    - "**/*.ts"
    - "**/*.tsx"
  excludePatterns:
    - "**/index.ts"
    - "node_modules/**"
    - "dist/**"
    - "**/*.spec.ts"
    - "**/*.test.ts"

check:
  # 09-17 修：原 content 只有 check.rules 而缺 check.tool，解释器无法识别，
  # 落兜底把整份规则 JSON 当字面量搜源码 → 必然 0 命中 → 面板显示"通过"（静默空跑）。
  # 现改用内核 forbiddenRegex 内联评估器：零外部工具依赖，逐行匹配且自动剥离
  # 字符串与注释（避免 import 出现在注释/字符串里造成误报）。
  #
  # 覆盖范围声明（诚实标注，避免"声明了却没查"的二次假通过）：
  #   ✓ no-direct-cross-module-import → 下述两条正则真实执行（import / require 两种写法）
  #   ↪ no-circular-module-ref        → 不在此重复实现，由 inspect.scan.depcruiser.circular-dependency
  #                                     规则（dependency-cruiser no-circular，含依赖图语义）覆盖
  #   ✗ enforce-barrel-export         → 需目录枚举能力，内联评估器无此语义，已移除
  #   ✗ feature-module-organization   → 需目录结构语义分析，正则会大量误报，已移除
  forbiddenRegex:
    - regex: 'from\s+["''][^"'']*/(?:modules|features)/[\w.-]+/(?!index)'
      message: '跨模块深引用：仅允许引用目标模块的 index 导出'
      suggestion: '改为从目标模块的 index.ts 导入，或将共享逻辑下沉到共享层'
    - regex: 'require\(\s*["''][^"'']*/(?:modules|features)/[\w.-]+/(?!index)'
      message: '跨模块深引用（require）：仅允许引用目标模块的 index 导出'
      suggestion: '改为从目标模块的 index.ts 导入，或将共享逻辑下沉到共享层'
  fileExts:
    - ".ts"
    - ".tsx"
  excludePatterns:
    - "**/index.ts"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/*.spec.ts"
    - "**/*.test.ts"
  severity: "error"

standards:
  ironnest:
    - "Rule #1: Module isolation + barrel exports"
    - "Rule #4: No circular imports — forwardRef is a code smell"
    - "Rule #11: Organize by feature, not by layer"
  osps: []
  semgrep:
    - "typescript/nestjs/security/audit/"

judgment:
  passCondition: "errorCount === 0"
  maxIssues: 20
  priority: "high"

score:
  impact: "architecture"
  weight: 0.10

fix:
  autoFixAvailable: false
  suggestionTemplate: |
    NestJS 模块边界违规：
    - 文件: {file}
    - 问题: {issue}
    - 模块: {fromModule} → {toModule}

    修复建议：
    1. 确保 {toModule} 有 index.ts 导出公共 API
    2. 修改 import 为：`import ... from '{toModule}'`
    3. 如需跨模块共享类型 → 提取到 @zh/shared
    4. 如出现循环引用 → 提取公共逻辑到共享模块，删除 forwardRef()

    📖 参考: IronNest #1 (module isolation), #4 (no circular imports)
