# =============================================================================
# SOP 规则模板 — Inspect · 枚举/常量使用规范
# =============================================================================
# 规则 ID: inspect.scan.internal.enum-usage
# 治理域: 巡检域 (inspect)
# 动作类型: 扫描检测 (scan)
# 数据来源: 内部模式 (internal)
# 对应适配器: Inspect TS · enum-usage
# 内部标准源: IronNest#06 Types/Enums/Constants · #30 Declaration Ownership
# 最后更新: 2026-07-29
# =============================================================================

apiVersion: sop/v1
kind: InspectRule
metadata:
  id: "inspect.scan.internal.enum-usage"
  name: "枚举/常量使用规范检查"
  description: "检查 const enum 使用（isolatedModules/Babel 转译下不可用）。窄口径规则：AST 级枚举/常量语义检查已移除，避免误报"
  version: "1.0.0"
  author: "智汇码盾官方"
  created: "2026-07-29"
  updated: "2026-07-29"
  status: "active"
  source: "internal"
  sourceRef: "IronNest rules/06 · rules/30"

governance:
  domain: "inspect"
  action: "scan"
  module: "Inspect"
  category: "typescript"

execution:
  mode: "async"
  timeout: 60
  maxConcurrency: 1
  retryCount: 0
  scope: "all"
  schedule: "on-push"

conditions:
  languages:
    - "typescript"
  filePatterns:
    - "*.ts"
    - "*.tsx"
  excludePatterns:
    - "node_modules/**"
    - "dist/**"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/*.d.ts"
    - "**/enums/**"        # 枚举声明文件自身不检查
    - "**/constants/**"     # 常量声明文件自身不检查
    - "**/generated/**"

check:
  # ── 09-18 改造 ────────────────────────────────────────────────────────────
  # 原写法 check.tool="custom-ast-scanner"（不存在）且 status=draft 从未执行。
  # 现改用内核 forbiddenRegex 内联评估器。
  #
  # 覆盖范围声明（本条为**窄口径**规则：宁可少查，不可误报）：
  #   ✓ const enum（TS 官方不推荐：isolatedModules/Babel 转译下不可用，跨包引用有兼容陷阱）
  #   ✗ enum 成员显式赋值 / 命名规范 / 魔法字符串比较 / 内联类型定义 → 均需 AST 语义，
  #     纯正则在真实项目误报率极高（任何 status === 'active' 都会命中），已移除；
  #     由 @typescript-eslint/naming-convention 等规则覆盖
  forbiddenRegex:
    - regex: "\\bconst\\s+enum\\b"
      message: "不建议使用 const enum（isolatedModules / Babel 转译下不可用，跨包引用存在兼容陷阱）"
      suggestion: "改用普通 enum，或 `as const` 对象 + 联合类型（推荐）"
  fileExts:
    - ".ts"
    - ".tsx"
  excludePatterns:
    - "**/*.spec.ts"
    - "**/*.test.ts"
    - "**/*.d.ts"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/generated/**"
  severity: "warning"
  categories:
    - "enums"
    - "constants"

judgment:
  passCondition: "warningCount < 5"
  blockOn: "warning"
  priority: "low"

standards:
  osps:
    - "OSPS-QS-03"
  cwe: []
  gitleaks: []

experience:
  totalHits: 0
  falsePositives: 0
  falsePositiveRate: 0.0
  avgFixTime: 300
  lastCalibrated: "2026-07-29"

fix:
  autoFixAvailable: false
  suggestionTemplate: |
    发现枚举/常量使用不规范：

    ⚠️ 文件: {file}:{line}
    ⚠️ 规则: {ruleId}
    ⚠️ 详情: {detail}

    修复指引：
    1. 枚举/常量在逻辑文件中 → 移至 `@shared/enums` 或 `model/<feature>.enums.ts`
    2. 魔法字符串 → 使用已定义的枚举成员
    3. 枚举无显式值 → `enum Status { ACTIVE = 'active', INACTIVE = 'inactive' }`
    4. 内联类型 → 在 `model/` 或 `interfaces/` 中声明后 import

    📖 参考: IronNest #06 类型/枚举/常量 · #30 声明所有权
