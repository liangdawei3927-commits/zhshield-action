# =============================================================================
# SOP 规则模板 — Inspect · TypeScript 空安全扫描
# =============================================================================
# 规则 ID: inspect.scan.internal.null-safety
# 治理域: 巡检域 (inspect)
# 动作类型: 扫描检测 (scan)
# 数据来源: 内部模式 (internal)
# 对应适配器: Inspect TS · null-safety
# 内部标准源: IronNest#00 rules 7 + 47 · IronNest#08 Database · CWE-476
# 最后更新: 2026-07-29
# =============================================================================

apiVersion: sop/v1
kind: InspectRule
metadata:
  id: "inspect.scan.internal.null-safety"
  name: "TypeScript 空安全扫描"
  description: "扫描空安全违规：非空断言运算符 ! 与 definite assignment 断言 !:。两项均为运行时无保证的编译器豁免写法"
  version: "1.0.0"
  author: "智汇码盾官方"
  created: "2026-07-29"
  updated: "2026-07-29"
  status: "active"
  source: "internal"
  sourceRef: "IronNest rules/00 (7, 47) · rules/08"

governance:
  domain: "inspect"
  action: "scan"
  module: "Inspect"
  category: "typescript"

execution:
  mode: "async"

conditions:
  languages:
    - "typescript"
  filePatterns:
    - "*.ts"
    - "*.tsx"
  excludePatterns:
    - "node_modules/**"
    - "dist/**"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/*.d.ts"

check:
  # ── 09-18 改造 ────────────────────────────────────────────────────────────
  # 原写法 check.tool="custom-ast-scanner"（不存在）且 status=draft 从未执行。
  # 现改用内核 forbiddenRegex 内联评估器（自动剥离字符串与注释）。
  #
  # 覆盖范围声明：
  #   ✓ no-non-null-assertion（非空断言 foo!.bar / arr[i]![0]）        → 真实执行
  #   ✓ no-definite-assignment（属性 definite assignment 断言 `foo!: T`）→ 真实执行
  #   ✗ optional-chaining-opportunity / nullable-deref / guard-before-access
  #     → 需类型推断与控制流分析，正则会大量误报，已移除；
  #       由 tsconfig strictNullChecks + @typescript-eslint 覆盖
  forbiddenRegex:
    - regex: "[A-Za-z0-9_$\\)\\]]!\\s*[.\\[(]"
      message: "使用非空断言运算符 !（运行时静默跳过 null 检查，掩盖潜在 TypeError）"
      suggestion: "改用类型守卫 / 可选链 ?. / 空值合并 ?? 或显式 if 判断"
    - regex: "^\\s*[A-Za-z_$\\s]*!\\s*[:;]"
      message: "使用 definite assignment 断言 !:（仅豁免编译器，无运行时保证）"
      suggestion: "在构造函数中初始化，或声明为可选属性并在使用前做守卫"
  fileExts:
    - ".ts"
    - ".tsx"
  excludePatterns:
    - "**/*.spec.ts"
    - "**/*.test.ts"
    - "**/*.d.ts"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/generated/**"
  severity: "warning"
  categories:
    - "null-safety"
    - "typescript"

judgment:
  passCondition: "errorCount === 0"
  blockOn: "error"
  priority: "medium"

standards:
  osps:
    - "OSPS-QS-03"
  cwe:
    - "CWE-476"
  gitleaks: []

experience:
  totalHits: 0
  falsePositives: 0
  falsePositiveRate: 0.0
  avgFixTime: 300
  lastCalibrated: "2026-07-29"

fix:
  autoFixAvailable: true
  suggestionTemplate: |
    发现空安全违规：

    ⚠️ 文件: {file}:{line}
    ⚠️ 规则: {ruleId}
    ⚠️ 详情: {message}

    修复指引：
    1. `variable!` → `if (variable !== null && variable !== undefined) { variable }` 或 `variable ?? fallback`
    2. `property!: Type` → 在构造函数中初始化或使用 DTO 声明语法
    3. `a && a.b.c` → `a?.b?.c`
    4. 集合元素访问 → `arr[i]` → `arr.at(i)` 或 `if (arr[i] !== undefined)`

    📖 参考: IronNest #00 规则 7 · 规则 47 · CWE-476 空指针解引用
