# =============================================================================
# SOP 规则模板 — Inspect · TypeScript 类型一致性检查
# =============================================================================
# 规则 ID: inspect.scan.internal.type-consistency
# 治理域: 巡检域 (inspect)
# 动作类型: 扫描检测 (scan)
# 数据来源: 内部模式 (internal)
# 对应适配器: Inspect TypeScript 适配器 · type-consistency
# 外部标准源: TypeScript strict mode + IronNest #3
# =============================================================================

apiVersion: sop/v1
kind: InspectRule
metadata:
  id: "inspect.scan.internal.type-consistency"
  name: "TypeScript 类型安全扫描（Semgrep 模式）"
  description: "通过 Semgrep 模式匹配检查函数参数和返回值类型的常见不一致问题，非 tsc 实际编译检查"
  version: "1.0.0"
  author: "智汇码盾官方"
  created: "2026-07-29"
  updated: "2026-07-29"
  status: "active"
  source: "internal"
  sourceRef: "TypeScript strict mode + IronNest #3 — strict type safety"

governance:
  domain: "inspect"
  action: "scan"
  module: "Inspect"
  adapter: "typescript"
  checker: "type-consistency"
  mode: "full"                 # full | incremental | focused | quick

execution:
  mode: "sync"
  timeout: 30
  maxConcurrency: 4
  retryCount: 0
  scope: "changed"

conditions:
  languages:
    - "typescript"
  filePatterns:
    - "*.ts"
    - "*.tsx"
  excludePatterns:
    - "node_modules/**"
    - "dist/**"
    - "*.d.ts"
    - "*.generated.ts"
    - "coverage/**"

check:
  # 09-17 修：原 content 只有 check.rules 而缺 check.tool，解释器无法识别，
  # 落兜底把整份规则 JSON 当字面量搜源码 → 必然 0 命中 → 面板显示"通过"（静默空跑）。
  # 原 pattern 字段用的是 Semgrep 元变量语法（$FUNC / $PARAM / $TYPE），内核无法执行；
  # 现改用内核 forbiddenRegex 内联评估器（逐行匹配，自动剥离字符串与注释，避免误报）。
  #
  # 覆盖范围声明（诚实标注，避免"声明了却没查"的二次假通过）：
  #   ✓ no-type-assertion     → as any 断言
  #   ✓ no-double-assertion   → as unknown as X 双重断言
  #   ✓ no-implicit-any-param → function 声明中无类型注解的参数
  #   ✗ strict-function-types（返回值必须显式声明）→ 需 AST 语义，正则会大量误报，已移除；
  #     该项由 tsconfig strict 与 @typescript-eslint/explicit-function-return-type 覆盖
  forbiddenRegex:
    - regex: "\\bas\\s+any\\b"
      message: "禁止 as any 类型断言（绕过类型检查）"
      suggestion: "改用精确类型、unknown + 类型守卫，或泛型约束"
    - regex: "\\bas\\s+unknown\\s+as\\b"
      message: "禁止 as unknown as 双重断言（等价于 as any）"
      suggestion: "使用类型守卫函数（is / asserts）替代强制断言"
    - regex: "function\\s+[A-Za-z_$][\\w$]*\\s*\\(\\s*[A-Za-z_$][\\w$]*\\s*(?:,|\\)\\s*\\{)"
      message: "函数参数缺少显式类型注解（隐式 any）"
      suggestion: "为参数补充显式类型，如 (input: InputDto) => ..."
  fileExts:
    - ".ts"
    - ".tsx"
  excludePatterns:
    - "**/*.spec.ts"
    - "**/*.test.ts"
    - "**/*.d.ts"
    - "**/*.generated.ts"
    - "**/node_modules/**"
    - "**/dist/**"
    - "**/coverage/**"
  severity: "warning"
  categories:
    - "type-safety"
    - "type-consistency"

standards:
  osps:
    - "OSPS-QA-04"             # 代码库安全要求
  ironnest:
    - "Rule #3"                # Strict type safety — no any, full strict mode
  semgrep:
    - "typescript/lang/security/"  # 参考路径

judgment:
  passCondition: "errorCount === 0"
  maxIssues: 50
  priority: "medium"

score:
  impact: "code-quality"       # 影响评分维度
  weight: 0.08                 # 在代码质量维度中的权重

fix:
  autoFixAvailable: false
  suggestionTemplate: |
    类型一致性检查发现问题：
    - 文件: {file}:{line}
    - 问题: {issue}
    - 建议: 为 {symbol} 添加显式类型声明

    修改示例：
    ```typescript
    // ❌ 问题写法
    function process(data) { ... }
    const result = data as any;

    // ✅ 正确写法
    function process(data: InputData): OutputData { ... }
    const result: OutputData = data;
    ```
