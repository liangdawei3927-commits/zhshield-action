# =============================================================================
# SOP 规则模板 — Cleanup · 无用文件检测
# =============================================================================
# 规则 ID: cleanup.scan.file.unused
# 治理域: 安全域 (security)
# 动作类型: 扫描检测 (scan)
# 数据来源: 内部模式 (internal)
# 对应适配器: Cleanup · 无用文件
# 内部标准源: IronNest#27 No Token-Burning · #21 YAGNI
# 最后更新: 2026-07-29
# =============================================================================

apiVersion: sop/v1
kind: SecurityRule
metadata:
  id: "security.scan.garbage.unused-file"
  name: "无用文件检测"
  description: "扫描项目中没有任何模块引用/导入的孤立文件，排除入口文件、配置文件、测试文件等已知必要文件。减小仓库体积、降低维护负担、减少 AI 上下文噪声"
  version: "1.0.0"
  author: "智汇码盾官方"
  created: "2026-07-29"
  updated: "2026-07-29"
  status: "draft"
  source: "internal"
  sourceRef: "IronNest rules/27 · rules/21"

governance:
  domain: "security"
  action: "scan"
  module: "Security"
  category: "garbage"

execution:
  mode: "async"
  timeout: 120
  maxConcurrency: 1
  retryCount: 0
  scope: "all"
  schedule: "weekly"

conditions:
  languages:
    - "any"
  filePatterns:
    - "*.ts"
    - "*.tsx"
    - "*.js"
    - "*.py"
    - "*.go"
    - "*.rs"
  excludePatterns:
    - "node_modules/**"
    - "dist/**"
    - "build/**"
    - "coverage/**"
    - ".next/**"
    - "**/*.test.*"
    - "**/*.spec.*"
    - "**/*.d.ts"
    - "**/generated/**"
    - "main.ts"
    - "index.ts"
    - "app.module.ts"
    - "bootstrap.ts"

check:
  tool: "custom-dead-file-analyzer"
  toolConfig:
    analysis:
      method: "import-graph"
      scope: "project-wide"
      minReferences: 1          # 至少被一个文件引用
    excludeByPattern:
      - "**/routes/**"
      - "**/router/**"
      - "**/*.config.ts"
      - "**/*.module.ts"        # NestJS 模块由框架自动发现
      - "**/*.interface.ts"     # 可能仅有类型引用
      - "**/types/**"
      - "**/interfaces/**"
    threshold:
      severity: "low"
      maxUnusedPercentage: 5    # 仓库中无用文件超过 5% 时发出警告
  severity: "low"
  categories:
    - "cleanup"
    - "dead-file"
    - "maintainability"

judgment:
  passCondition: "unusedPercentage < 5"
  blockOn: "info"
  priority: "low"

standards:
  osps:
    - "OSPS-QS-03"
  cwe: []
  gitleaks: []

experience:
  totalHits: 0
  falsePositives: 0
  falsePositiveRate: 0.0
  avgFixTime: 60
  lastCalibrated: "2026-07-29"

fix:
  autoFixAvailable: true
  suggestionTemplate: |
    发现可能无用的文件：

    ⚠️ 文件: {file}
    ⚠️ 引用数: {referenceCount}
    ⚠️ 建议: {suggestion}

    该文件在代码库中未被任何其他文件引用。

    处置建议：
    1. 确认文件确实不再需要 → 删除
    2. 如为预留代码但暂未使用 → 添加 `@todo` 注释标注计划用途
    3. 如为历史迁移遗留 → 检查 Git 历史确认是否可安全删除

    📖 参考: IronNest #27 No Token-Burning Code · #21 YAGNI
