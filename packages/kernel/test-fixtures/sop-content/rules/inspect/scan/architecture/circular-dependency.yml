name: Circular Dependency Detection
description: 检测循环依赖 — 防止模块间循环引用
severity: error
executionMode: async
status: active
source: official
tags: [architecture, circular, dependency]
applicableEngines: [inspect]
detection:
  maxDepth: 20
  excludePatterns:
    - '*.test.ts'
    - '**/node_modules/**'
check:
  tool: dep-cruiser # 循环依赖检测
  toolConfig:
    # 内置校验配置（内核资产），被扫描项目无需自带 .dependency-cruiser.cjs
    config: '@zh/kernel/dist/assets/dependency-cruiser/.dependency-cruiser.cjs'
