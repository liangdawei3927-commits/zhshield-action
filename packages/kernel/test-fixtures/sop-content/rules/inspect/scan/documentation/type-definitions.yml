name: Type Definitions Documentation
description: 检查 TypeScript 类型定义是否文档化
severity: info
executionMode: async
status: active
source: official
tags: [documentation, typescript, types]
applicableEngines: [inspect]
required:
  # 导出 interface / type 别名必须有前置 JSDoc 文档
  - path: src
    fileExts: ['.ts']
    jsdocOn:
      - '^\s*export\s+interface\s+'
      - '^\s*export\s+type\s+'
