packages:
  - 'packages/*'

allowBuilds:
  '@nestjs/core': false
  '@scarf/scarf': true
  better-sqlite3: true
  electron: true
  electron-winstaller: true
  esbuild: false

minimumReleaseAgeExclude:
  - hono@4.13.1
  - nanoid@3.3.18

onlyBuiltDependencies:
  - '@nestjs/core'
  - 'better-sqlite3'
  - 'electron'
  - 'esbuild'

# 安全补丁：强制修复已知漏洞的传递依赖版本
overrides:
  'brace-expansion@^1': '1.1.18'
  'brace-expansion@^2': '2.1.4'
  'brace-expansion@^5': '5.0.9'
  'fast-uri@^3': '3.1.5'
  'hono@^4': '4.13.1'
  'js-yaml@^4': '4.3.1'
  'nanoid@^3': '3.3.18'
  'qs@^6': '6.15.3'
