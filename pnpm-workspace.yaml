packages:
  - 'packages/*'

overrides:
  js-yaml: '>=4.3.1'
  lodash: '>=4.17.23'
  qs: '>=6.15.2'
  body-parser: '>=1.20.6'
  fast-uri: '>=3.1.5'
  multer: '>=2.2.0'
  hono: '>=4.12.34'
  nanoid: '>=3.3.18'

allowBuilds:
  '@nestjs/core': false
  '@scarf/scarf': false
  better-sqlite3: true
  electron: true
  esbuild: false

onlyBuiltDependencies:
  - '@nestjs/core'
  - 'better-sqlite3'
  - 'electron'
  - 'esbuild'
